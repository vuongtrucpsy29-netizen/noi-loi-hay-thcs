<script>
const groups=[{id:'family',name:'Gia đình',icon:'🏡',intro:'Chia sẻ suy nghĩ, lắng nghe và trao đổi với người thân.'},{id:'school',name:'Nhà trường',icon:'🎒',intro:'Tự tin bày tỏ, hợp tác và giải quyết bất đồng.'},{id:'public',name:'Nơi công cộng',icon:'🌿',intro:'Lịch sự và tôn trọng không gian chung.'},{id:'online',name:'Không gian mạng',icon:'💬',intro:'Bình luận có trách nhiệm, bảo vệ sự riêng tư.'}];
const scenarios=[
['family','Xin một khoảng nghỉ','Sau ngày học dài, bạn muốn nghỉ 15 phút. Mẹ muốn bạn học ngay vì lo bạn sẽ quên giờ.',['Cãi lại rồi đóng cửa phòng.','Nói mình đang mệt, đề nghị nghỉ 15 phút và đặt báo giờ.','Không nói gì và tiếp tục dùng điện thoại.'],1,'Nói rõ cảm xúc, đưa thời gian cụ thể và thực hiện lời hứa giúp người thân yên tâm.','Con đang hơi mệt. Con xin nghỉ 15 phút, đặt báo giờ rồi bắt đầu học lúc 7 giờ được không ạ?'],
['family','Khi bị so sánh','Bố nói bạn học chưa tốt bằng một bạn khác. Bạn buồn và muốn được góp ý về tiến bộ của chính mình.',['Chọn lúc bình tĩnh để nói cảm xúc và đề nghị cùng xem phần chưa hiểu.','Nói bố không hiểu gì rồi bỏ đi.','Cố giấu mọi điểm số từ nay.'],0,'Tránh quy kết. Nói vào câu nói cụ thể, cảm xúc và hỗ trợ bạn mong muốn.','Khi nghe bị so sánh, con thấy buồn. Bố giúp con đặt mục tiêu theo tiến bộ của con được không ạ?'],
['family','Thương lượng kế hoạch','Bạn đã hẹn học nhóm chiều thứ Bảy, nhưng gia đình muốn bạn cùng đi thăm người thân.',['Tự ý đi học nhóm.','Hủy hẹn với bạn mà không báo.','Nói về hai kế hoạch, hỏi lý do và cùng tìm thời gian phù hợp.'],2,'Kế hoạch liên quan nhiều người cần được trao đổi; đừng tự thay đổi lịch của người khác.','Con đã hẹn học nhóm. Mình có thể đổi giờ đi thăm, hoặc để con hỏi nhóm đổi giờ được không ạ?'],
['school','Từ chối cho chép bài','Bạn thân xin chép bài và nói sẽ giận nếu bạn không cho.',['Đưa bài vì sợ mất bạn.','Từ chối rõ ràng và đề nghị cùng học phần khó.','Chê bạn lười trước cả lớp.'],1,'Giữ ranh giới và vẫn thể hiện sự quan tâm. Bạn không cần đồng ý với điều sai để giữ tình bạn.','Mình không gửi bài để chép được. Nhưng mình có thể cùng bạn xem phần đang vướng nhé.'],
['school','Bất đồng khi làm nhóm','Hai bạn muốn chọn hai cách trình bày khác nhau. Cả hai bắt đầu nói to.',['Ngắt lời để bảo vệ ý kiến.','Để người nói to nhất quyết định.','Tạm dừng, nghe từng phương án và so sánh theo yêu cầu bài.'],2,'Đưa cuộc trao đổi về mục tiêu chung và tiêu chí cụ thể, tránh hơn thua.','Mình cùng xem mỗi cách đáp ứng yêu cầu nào nhé. Mỗi bạn nói một phút rồi nhóm chọn.'],
['school','Xin lỗi sau lời nói nặng','Bạn bực và nói một câu làm bạn cùng lớp tổn thương.',['Xin lỗi nhưng nói bạn ấy quá nhạy cảm.','Thừa nhận câu nói, xin lỗi và đề nghị cách sửa.','Giả vờ chưa có chuyện gì.'],1,'Lời xin lỗi có trách nhiệm nêu việc mình làm và cách sửa, không đổ lỗi cho người bị tổn thương.','Mình xin lỗi vì câu nói lúc nãy. Nó không công bằng với bạn. Mình sẽ bình tĩnh trước khi nói.'],
['school','Hỏi thầy cô khi chưa hiểu','Bạn chưa hiểu yêu cầu bài tập nhưng ngại hỏi trước lớp.',['Đoán và làm đại.','Nói thầy cô giảng khó hiểu.','Nêu phần đã hiểu và hỏi cụ thể phần còn vướng, hoặc xin hỏi sau tiết học.'],2,'Câu hỏi cụ thể giúp người nghe hỗ trợ đúng chỗ; bạn có thể chọn thời điểm phù hợp.','Em hiểu phần thứ nhất, nhưng chưa rõ cần lấy mấy ví dụ ở phần hai. Cô hướng dẫn lại giúp em được không ạ?'],
['public','Giữ trật tự trên xe','Nhóm bạn nói chuyện rất to trên xe buýt. Bạn thấy người xung quanh khó chịu.',['Nhắc nhẹ để cả nhóm nói nhỏ hơn.','Quát bạn trước mọi người.','Nói to hơn cho vui.'],0,'Nhắc ngắn, lịch sự và nêu ảnh hưởng của hành vi, không làm bạn mất mặt.','Mình nói nhỏ chút nhé, có người đang nghỉ phía sau.'],
['public','Khi bị chen hàng','Một người chen lên trước bạn ở quầy. Bạn khó chịu.',['Đẩy người đó ra.','Nói bình tĩnh rằng mình đang xếp hàng, cần thì nhờ nhân viên.','Chửi người đó.'],1,'Ưu tiên an toàn. Có thể nhắc lịch sự và nhờ người phụ trách thay vì đối đầu.','Mình đang xếp hàng ở đây. Bạn vui lòng đứng phía sau nhé.'],
['public','Làm đổ đồ của người khác','Bạn vô tình va vào và làm đổ đồ uống của người bên cạnh.',['Bỏ đi vì xấu hổ.','Nói không phải lỗi của mình.','Xin lỗi, hỏi người đó có sao không và đề nghị hỗ trợ dọn.'],2,'Nhận trách nhiệm trong khả năng của mình và hỏi trước khi giúp.','Mình xin lỗi vì đã va vào bạn. Bạn có sao không? Mình giúp lau và nhờ nhân viên nhé.'],
['online','Bình luận khó chịu','Một người bình luận chế giễu bài đăng của bạn.',['Đáp lại bằng lời xúc phạm.','Tạm dừng, chọn không phản hồi hoặc nói ranh giới; dùng chặn/báo cáo nếu cần.','Đăng thông tin cá nhân của người đó.'],1,'Bạn không cần trả lời mọi bình luận. Lưu bằng chứng và tìm hỗ trợ nếu hành vi lặp lại hoặc có đe dọa.','Mình không đồng ý với cách nói này. Nếu muốn góp ý, bạn vui lòng trao đổi tôn trọng.'],
['online','Chia sẻ ảnh của bạn','Bạn muốn đăng ảnh nhóm, nhưng một bạn nói không muốn xuất hiện trên mạng.',['Tôn trọng ý kiến, chọn ảnh khác hoặc che phần ảnh của bạn ấy khi được đồng ý.','Đăng vì đó là ảnh của nhóm.','Ép bạn đồng ý.'],0,'Quyền riêng tư cần được tôn trọng; im lặng không đồng nghĩa với đồng ý.','Mình sẽ chọn ảnh khác. Bạn muốn mình bỏ ảnh này hay che phần của bạn?'],
['online','Tin nhắn từ người lạ','Người lạ nhắn xin địa chỉ, ảnh riêng tư và yêu cầu bạn giữ bí mật.',['Gửi để họ tin mình.','Hẹn gặp một mình.','Không gửi thông tin, ngừng liên hệ và báo người lớn đáng tin.'],2,'Yêu cầu giữ bí mật và xin thông tin riêng tư là dấu hiệu cần thận trọng. Ưu tiên an toàn, lưu bằng chứng nếu an toàn.','Mình sẽ không gửi thông tin riêng tư. Mình cần nói với người lớn đáng tin về chuyện này.'],
['online','Hiểu nhầm trong nhóm chat','Câu trả lời ngắn của bạn khiến bạn khác nghĩ bạn đang cáu.',['Mỉa mai vì họ hiểu sai.','Giải thích ý mình, hỏi lại và chuyển sang nói trực tiếp nếu cần.','Kéo cả nhóm vào tranh cãi.'],1,'Tin nhắn thiếu giọng nói và nét mặt nên dễ bị hiểu nhầm. Hỏi lại trước khi quy kết.','Ý mình lúc nãy là mình chưa biết câu trả lời, không phải đang giận. Bạn hiểu thế nào để mình giải thích rõ hơn?']
].map((s,i)=>({id:i,group:s[0],title:s[1],story:s[2],options:s[3],best:s[4],why:s[5],sample:s[6]}));
const app=document.querySelector('#app');let filter='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const group=id=>groups.find(g=>g.id===id);const saved=()=>{try{return JSON.parse(localStorage.getItem('noi-loi-hay-progress')||'[]')}catch{return[]}};function mark(id){try{localStorage.setItem('noi-loi-hay-progress',JSON.stringify([...new Set([...saved(),id])]))}catch{}}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">MỘT CUỘC TRÒ CHUYỆN TỐT BẮT ĐẦU TỪ BẠN</div><h1>Tự tin nói.<br><span>Biết lắng nghe.</span><br>Ứng xử tử tế.</h1><p class="muted">Thử những tình huống quen thuộc, cân nhắc cách phản hồi và luyện bằng lời của chính mình.</p><div class="actions"><button onclick="location.hash='#practice'">Chọn tình huống để luyện</button><button class="secondary" onclick="location.hash='#chat'">Trò chuyện cùng AI</button></div></div><div class="conversation"><div class="eyebrow" style="color:#dbe3ff">MỘT CÁCH NÓI KHÁC</div><div class="say">“Mình không muốn cho bạn chép bài, nhưng sợ bạn giận…”</div><div class="say reply">“Mình không gửi bài để chép được. Nhưng mình có thể cùng bạn xem phần đang vướng nhé.”</div><small>Rõ ràng với lựa chọn của mình. Tôn trọng người đối diện.</small></div></section><div class="cards">${groups.map(g=>`<article class="card"><div class="icon">${g.icon}</div><h3>${g.name}</h3><p>${g.intro}</p><a href="#practice/${g.id}">${scenarios.filter(s=>s.group===g.id).length} tình huống · Khám phá</a></article>`).join('')}</div><section class="steps"><div><b>01 · Thử một lựa chọn</b><p>Nhận diện tình huống và cân nhắc ảnh hưởng.</p></div><div><b>02 · Luyện lời của bạn</b><p>Viết câu phản hồi, đọc gợi ý và thử diễn đạt lại.</p></div><div><b>03 · Mang vào cuộc sống</b><p>Đóng vai cùng bạn và vận dụng khi phù hợp.</p></div></section>`}
function practice(id){filter=groups.some(g=>g.id===id)?id:'all';const done=saved();app.innerHTML=`<div class="eyebrow">LUYỆN TÌNH HUỐNG</div><h1 style="font-size:42px">Chọn một chuyện gần với bạn.</h1><p class="muted">Đã thực hành ${done.length}/${scenarios.length} tình huống trên máy này. Đây là tiến độ luyện tập, không phải điểm đánh giá bạn.</p><div class="filter"><button class="${filter==='all'?'active':''}" onclick="location.hash='#practice'">Tất cả</button>${groups.map(g=>`<button class="${filter===g.id?'active':''}" onclick="location.hash='#practice/${g.id}'">${g.icon} ${g.name}</button>`).join('')}</div><div class="practicegrid">${scenarios.filter(s=>filter==='all'||s.group===filter).map(s=>`<article class="card"><span class="tag">${group(s.group).name.toUpperCase()} ${done.includes(s.id)?'· ĐÃ LUYỆN':''}</span><h3>${s.title}</h3><p>${s.story}</p><button onclick="location.hash='#scenario/${s.id}'">Thử tình huống</button></article>`).join('')}</div>`}
function detail(id){const s=scenarios.find(s=>s.id===Number(id));if(!s)return practice();app.innerHTML=`<section class="detail"><button class="secondary" onclick="location.hash='#practice/${s.group}'">Về danh sách</button><p class="tag">${group(s.group).name.toUpperCase()}</p><h1>${s.title}</h1><div class="situation">${s.story}</div><h3>Bạn sẽ chọn cách nào?</h3>${s.options.map((o,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback"></div><h3>Thử viết bằng lời của bạn</h3><textarea id="own" maxlength="1500" placeholder="Bạn sẽ nói hoặc làm gì?"></textarea><div class="actions"><button id="hint">Xem câu nói tham khảo</button><button class="secondary" id="aiPractice">Cùng AI luyện thêm</button><button class="secondary" onclick="detail(${s.id})">Luyện lại</button></div><div id="sample"></div></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const good=Number(b.dataset.choice)===s.best;document.querySelector('#feedback').innerHTML=`<div class="feedback"><b>${good?'Đây là một cách phù hợp.':'Cùng cân nhắc một cách khác.'}</b><p>${good?s.why:'Lựa chọn này có thể làm tình huống căng thẳng hoặc khó giải quyết hơn. '+s.why}</p><b>Hướng thử:</b> ${s.options[s.best]}</div>`;mark(s.id)});document.querySelector('#hint').onclick=()=>{document.querySelector('#sample').innerHTML=`<div class="feedback"><b>Một câu có thể thử</b><p>“${s.sample}”</p><small>Bạn có thể đổi cách xưng hô và từ ngữ cho phù hợp.</small></div>`;mark(s.id)};document.querySelector('#aiPractice').onclick=()=>{chatDraft=`Mình đang luyện tình huống: ${s.story}\nCâu trả lời mình thử viết: ${document.querySelector('#own').value||'(mình chưa biết nói thế nào)'}\nBạn giúp mình nhận xét và cùng mình đóng vai nhé.`;location.hash='#chat'}}
const foundations=[['Bạn không cần nói hoàn hảo','Giao tiếp tốt là nói rõ điều mình cần, lắng nghe người khác và chọn cách ứng xử phù hợp. Bạn có thể luyện từng bước.',['Chọn một tình huống gần với bạn.','Đọc cách xử lý và thử nói thành tiếng.','Nhìn lại điều đã giúp cuộc trao đổi tốt hơn.'],'Hôm nay mình muốn luyện một cuộc trò chuyện nào?'],['Ba mức luyện tập','Bạn có thể cần gợi ý trong tình huống này và tự tin trong tình huống khác. Các mức không phải nhãn đánh giá bạn.',['Nhận biết: gọi tên cảm xúc và mục đích.','Có gợi ý: hoàn thành câu mẫu hoặc đóng vai.','Vận dụng: tự chọn cách nói và điều chỉnh sau khi nghe.'],'Mình chọn mức nào để có thể luyện được hôm nay?'],['Dừng lại trước khi phản ứng','Khi tức giận, bạn có thể cần một khoảng dừng trước khi lựa chọn lời nói.',['Nhận ra tín hiệu: tim nhanh, giọng lớn, muốn ngắt lời.','Thở chậm và tạm dừng khi an toàn.','Hẹn thời điểm quay lại, rồi nói về sự việc cụ thể.'],'Mình đang bực. Mình xin bình tĩnh vài phút rồi nói tiếp nhé.'],['Lắng nghe để hiểu','Lắng nghe không có nghĩa là đồng ý với mọi điều. Bạn có thể hiểu điều người khác cần rồi bày tỏ ý kiến.',['Để người kia nói hết khi có thể.','Nhắc lại ý chính bằng lời của mình.','Hỏi điều chưa rõ trước khi kết luận.'],'Ý bạn là bạn lo nhóm không kịp làm xong, đúng không?'],['Nói rõ cảm xúc và đề nghị','Câu nói về cảm xúc có ích khi gắn với sự việc cụ thể và một bước tiếp theo.',['Nêu sự việc, tránh “lúc nào cũng” hoặc “chẳng bao giờ”.','Nói cảm xúc và điều bạn cần.','Đề nghị một việc cụ thể, vừa sức.'],'Khi bị ngắt lời, mình khó nói hết ý. Bạn cho mình nói xong rồi góp ý nhé.'],['Từ chối mà vẫn tôn trọng','Bạn có quyền từ chối yêu cầu không phù hợp và giữ ranh giới của mình.',['Nói không rõ ràng, không cần giải thích quá nhiều.','Giữ giọng bình tĩnh và lặp lại khi bị ép.','Đề nghị phương án phù hợp nếu bạn muốn và thấy an toàn.'],'Mình không đồng ý việc đó. Mình có thể giúp bạn bằng cách khác.'],['Xin lỗi có trách nhiệm','Lời xin lỗi không xóa ngay tổn thương. Hành động sau lời xin lỗi cũng quan trọng.',['Nêu việc mình đã làm.','Xin lỗi, không đổ lỗi ngược lại.','Hỏi cách sửa trong khả năng và thay đổi hành vi.'],'Mình xin lỗi vì đã nói nặng lời. Mình sẽ để bạn nói hết trước khi phản hồi.'],['Nhìn từ hai phía','Bất đồng có thể xuất phát từ hai nhu cầu khác nhau, không nhất thiết vì ai đó muốn gây khó dễ.',['Nói điều bạn lo hoặc cần.','Hỏi người kia đang cần điều gì.','Tìm mục tiêu chung và một cách thử cụ thể.'],'Mình muốn làm nhanh, còn bạn muốn đọc kỹ đề. Mình cùng đọc 5 phút rồi chia việc nhé.']];
const bookPages=[
{type:'cover',chapter:'CẨM NANG GIAO TIẾP & ỨNG XỬ',title:'Nói lời hay',subtitle:'Tự tin bày tỏ. Biết lắng nghe. Cùng tìm cách giải quyết.',scene:'school',content:'<p>Dành cho học sinh lớp 6–9</p><div class="cover-line">Trong gia đình · Ở trường<br>Nơi công cộng · Trên không gian mạng</div>'},
{chapter:'LỜI MỞ ĐẦU',title:'Bạn không cần tìm câu nói hoàn hảo',content:`<p>Giao tiếp tốt là nói rõ điều mình muốn, lắng nghe điều người khác cần và lựa chọn cách ứng xử phù hợp với hoàn cảnh. Có lúc bạn sẽ ngại, bực hoặc chưa biết nói thế nào. Những kỹ năng này có thể luyện từng chút một.</p><p>Cuốn cẩm nang giúp bạn nhận diện điều đang xảy ra, cân nhắc các lựa chọn và thử lời nói của chính mình. Câu mẫu là điểm bắt đầu; hãy thay đổi để phù hợp với bạn.</p><h3>Cách dùng cuốn sách</h3><ol><li>Chọn một chương gần với tình huống bạn đang gặp.</li><li>Đọc hướng dẫn và xem một cách diễn đạt.</li><li>Thực hành cùng bạn hoặc người lớn đáng tin.</li><li>Nhìn lại điều đã giúp cuộc trao đổi tốt hơn.</li></ol><aside>Đừng chỉ đọc. Hãy chọn một câu để thử nói thành tiếng hôm nay.</aside>`},
{type:'toc',chapter:'MỤC LỤC',title:'Mở đúng trang bạn cần',content:''},
{chapter:'CHƯƠNG 1 · NỀN TẢNG',title:'Ba mức luyện tập',content:`<p>Đây là các mức luyện tập để bạn chọn hoạt động phù hợp, không phải thang đo hoặc nhãn đánh giá năng lực của bạn.</p><div class="level"><b>01 · Nhận biết</b><p>Nhận ra cảm xúc, mục đích trao đổi và điều có thể ảnh hưởng đến người khác. Chọn giữa các cách nói khác nhau.</p></div><div class="level"><b>02 · Thực hành có gợi ý</b><p>Dùng câu mẫu, đóng vai và nhận phản hồi. Luyện cách chào hỏi, bày tỏ, từ chối, xin lỗi và giải quyết hiểu nhầm.</p></div><div class="level"><b>03 · Vận dụng linh hoạt</b><p>Tự chọn thời điểm, cách xưng hô và cách nói phù hợp với người đối diện. Điều chỉnh sau khi lắng nghe.</p></div><aside>Bạn có thể cần gợi ý ở tình huống này và tự tin ở tình huống khác. Cứ chọn mức giúp mình luyện được.</aside>`},
{chapter:'CHƯƠNG 1 · NỀN TẢNG',title:'Lắng nghe để hiểu',content:`<p>Lắng nghe không có nghĩa là phải đồng ý. Bạn đang cố hiểu thông điệp trước khi phản hồi.</p><h3>Bốn điều có thể làm</h3><ul><li>Tạm dừng việc khác, chú ý người đang nói theo cách bạn thấy thoải mái.</li><li>Để họ nói hết một ý; nếu cần ngắt, xin phép.</li><li>Hỏi một câu làm rõ thay vì tự đoán.</li><li>Nhắc lại điều đã hiểu để hai bên kiểm tra.</li></ul><blockquote>“Mình hiểu là bạn đang lo nhóm không kịp hoàn thành. Mình hiểu đúng chưa?”</blockquote><h3>Khi bạn không muốn kể</h3><p>Không ép người khác chia sẻ. Bạn có thể nói: “Khi nào bạn muốn nói thì mình sẵn sàng nghe.”</p><aside>Thử luyện: Một người kể chuyện trong một phút. Người còn lại chỉ hỏi để hiểu, chưa đưa lời khuyên. Sau đó đổi vai.</aside>`},
{chapter:'CHƯƠNG 1 · NỀN TẢNG',title:'Nói rõ mà vẫn tôn trọng',content:`<p>Ba cách phản hồi thường thấy là né tránh, công kích và bày tỏ rõ ràng. Tình huống có thể khác nhau, nhưng bạn có thể thử cách nói vừa giữ ranh giới vừa tôn trọng người khác.</p><div class="comparison"><b>Né tránh</b><p>Không nói điều mình cần, đồng ý dù không muốn rồi bỏ thực hiện.</p><b>Công kích</b><p>Quát mắng, xúc phạm hoặc ép người khác phải làm theo.</p><b>Bày tỏ rõ ràng</b><p>Nêu sự việc, cảm xúc và đề nghị cụ thể; nghe câu trả lời.</p></div><blockquote>“Khi bị ngắt lời, mình khó trình bày hết ý. Mình muốn nói xong rồi nghe ý kiến của bạn.”</blockquote><aside>Công thức để thử: Khi… / Mình cảm thấy… / Mình mong muốn… / Bạn nghĩ sao?</aside><p>Công thức không đảm bảo người khác sẽ đồng ý. Bạn vẫn có thể giữ lựa chọn của mình và tìm cách trao đổi khác.</p>`},
{chapter:'CHƯƠNG 1 · NỀN TẢNG',title:'Khi cảm xúc đang rất mạnh',content:`<p>Lúc bực hoặc lo, bạn có thể muốn trả lời ngay. Một khoảng dừng giúp bạn có thêm lựa chọn.</p><ol><li><b>Nhận ra:</b> Mình đang thấy gì? Cơ thể có căng, giọng có lớn hơn không?</li><li><b>Tạm dừng:</b> Đặt điện thoại xuống hoặc xin nghỉ một lát. Chậm lại bằng vài nhịp thở thoải mái.</li><li><b>Chọn mục tiêu:</b> Mình muốn được hiểu, bảo vệ ranh giới hay thống nhất cách làm?</li><li><b>Quay lại:</b> Nếu an toàn, trở lại cuộc trao đổi vào thời điểm đã hẹn.</li></ol><blockquote>“Mình đang khá bực nên sợ nói lời không phù hợp. Mình xin dừng 10 phút, rồi mình trao đổi tiếp nhé.”</blockquote><aside>Tạm dừng để bình tĩnh khác với im lặng để trừng phạt. Nếu có thể, hãy nói rõ khi nào bạn sẵn sàng quay lại.</aside>`},
{chapter:'CHƯƠNG 1 · NỀN TẢNG',title:'Giải quyết vấn đề từng bước',content:`<ol><li><b>Nêu sự việc:</b> Điều gì đã xảy ra? Tách việc quan sát được khỏi phỏng đoán.</li><li><b>Nghe mỗi bên:</b> Mỗi người mong muốn hoặc lo điều gì?</li><li><b>Tìm lựa chọn:</b> Đề xuất ít nhất hai cách, xem ảnh hưởng tới các bên.</li><li><b>Thống nhất:</b> Ai làm gì, khi nào? Có cần người hỗ trợ không?</li><li><b>Nhìn lại:</b> Cách đã chọn có giúp giải quyết không? Điều chỉnh nếu cần.</li></ol><blockquote>“Mình thấy hai bạn cùng muốn làm phần trình bày. Mình thử chia hai phần, hay một bạn trình bày và một bạn trả lời câu hỏi?”</blockquote><aside>Nếu có đe dọa, ép buộc hoặc bạo lực, ưu tiên an toàn và tìm người lớn hỗ trợ. Bạn không có trách nhiệm tự hòa giải một tình huống nguy hiểm.</aside>`},
{chapter:'CHƯƠNG 2 · GIA ĐÌNH',title:'Chia sẻ để người thân hiểu',scene:'family',content:`<p>Giữa việc học, nghỉ ngơi và kỳ vọng của gia đình, đôi khi hai bên chưa hiểu nhu cầu của nhau.</p><h3>Chọn thời điểm và đề nghị rõ</h3><ul><li>Hỏi người thân có thể nghe bạn lúc này không.</li><li>Nói về một việc cụ thể, tránh gom nhiều lỗi cũ vào một cuộc trao đổi.</li><li>Giải thích nhu cầu và đưa ra phương án có thể thực hiện.</li></ul><blockquote>“Con đang mệt sau buổi học. Con xin nghỉ 15 phút rồi bắt đầu làm bài lúc 7 giờ được không ạ?”</blockquote><aside>Mức 1: Nhận ra nhu cầu của hai bên. Mức 2: Luyện câu đề nghị. Mức 3: Tự thương lượng một phương án và thực hiện.</aside>`},
{chapter:'CHƯƠNG 2 · GIA ĐÌNH',title:'Khi chưa được đồng ý',content:`<p>Người thân không đồng ý chưa chắc có nghĩa là không quan tâm. Hãy hỏi lý do và xem có điều gì điều chỉnh được.</p><h3>Tình huống</h3><p>Bạn muốn đi chơi với nhóm, nhưng cha mẹ lo về thời gian và việc di chuyển.</p><ol><li>Hỏi điều khiến cha mẹ lo nhất.</li><li>Trình bày nơi đến, thời gian và cách di chuyển phù hợp.</li><li>Đề nghị phương án khác nếu chưa được đồng ý.</li><li>Nếu cuộc nói chuyện căng, hẹn trao đổi lại.</li></ol><blockquote>“Con hiểu bố mẹ lo việc đi về. Con có thể về sớm hơn hoặc chọn địa điểm gần nhà. Bố mẹ thấy cách nào phù hợp hơn ạ?”</blockquote><aside>Tránh hứa điều bạn không thực hiện được. Thống nhất rõ và báo lại nếu kế hoạch thay đổi.</aside>`},
{chapter:'CHƯƠNG 2 · GIA ĐÌNH',title:'Nhận lỗi và khắc phục',content:`<p>Lời xin lỗi có ý nghĩa hơn khi đi cùng nhận trách nhiệm và hành động cụ thể.</p><h3>Tình huống</h3><p>Bạn lấy đồ của anh/chị khi chưa hỏi và làm hỏng.</p><blockquote>“Em đã lấy đồ khi chưa hỏi và làm hỏng. Em xin lỗi. Em sẽ cùng anh/chị tìm cách sửa, và lần sau hỏi trước khi mượn.”</blockquote><ul><li>Nói rõ việc mình làm, không thêm “nhưng tại anh/chị…”.</li><li>Hỏi cách khắc phục phù hợp, không hứa quá khả năng.</li><li>Cho người kia thời gian; họ có thể chưa hết buồn ngay.</li></ul><aside>Tự luyện: Viết một lời xin lỗi gồm sự việc – nhận trách nhiệm – cách sửa. Bạn sẽ làm gì để tránh lặp lại?</aside>`},
{chapter:'CHƯƠNG 3 · NHÀ TRƯỜNG',title:'Làm quen và hợp tác',scene:'school',content:`<p>Chủ động một bước nhỏ có thể mở ra cuộc trò chuyện. Người đối diện cũng có quyền chọn tham gia hay chưa.</p><blockquote>“Chào bạn, mình học cùng lớp. Bạn có muốn cùng xuống sân không? Nếu bạn muốn nghỉ ở đây thì cũng được nhé.”</blockquote><h3>Khi làm việc nhóm</h3><ul><li>Thống nhất nhiệm vụ và thời gian trước khi bắt đầu.</li><li>Mời bạn ít nói chia sẻ nhưng không ép trả lời.</li><li>Đánh giá ý tưởng bằng tiêu chí, tránh chê người đưa ý tưởng.</li></ul><aside>Mức 1: Chọn lời mời thân thiện. Mức 2: Đóng vai làm quen. Mức 3: Chủ động trao đổi trong một hoạt động nhóm thật.</aside>`},
{chapter:'CHƯƠNG 3 · NHÀ TRƯỜNG',title:'Từ chối mà không làm tổn thương',content:`<p>Bạn có thể từ chối yêu cầu không phù hợp, kể cả từ bạn thân. Sự tôn trọng không đòi hỏi bạn phải đồng ý mọi việc.</p><h3>Tình huống</h3><p>Bạn được nhờ cho chép bài. Bạn muốn giúp nhưng không muốn gửi bài để chép.</p><blockquote>“Mình không gửi bài để bạn chép được. Nhưng mình có thể giải thích cách làm phần bạn đang vướng.”</blockquote><ul><li>Nói ngắn, rõ điều bạn không đồng ý.</li><li>Không cần đưa nhiều lý do để người khác tranh luận từng lý do.</li><li>Đề nghị hỗ trợ khác nếu bạn muốn và có khả năng.</li><li>Nếu tiếp tục bị ép, nhắc lại lựa chọn và tìm hỗ trợ khi cần.</li></ul><aside>Thử đổi vai: Người nhờ chép bài nói “Bạn thân mà không giúp?”. Người còn lại luyện giữ ranh giới bằng lời bình tĩnh.</aside>`},
{chapter:'CHƯƠNG 3 · NHÀ TRƯỜNG',title:'Bất đồng và hỗ trợ cảm xúc',content:`<h3>Khi ý kiến khác nhau</h3><p>Nói rõ ý tưởng và lý do, rồi hỏi để hiểu lựa chọn của bạn.</p><blockquote>“Mình lo phương án này không kịp thời gian. Nhóm mình thử so sánh hai cách theo yêu cầu bài và thời gian nhé?”</blockquote><h3>Khi một người bạn buồn</h3><p>Đừng vội nói “có gì đâu” hoặc đưa lời khuyên. Lắng nghe và hỏi bạn cần gì.</p><blockquote>“Mình thấy chuyện này làm bạn buồn. Bạn muốn mình nghe hay cùng nghĩ cách giải quyết?”</blockquote><p>Không chia sẻ câu chuyện riêng của bạn ấy với cả nhóm. Nếu bạn ấy bị đe dọa hoặc không an toàn, hãy tìm người lớn đáng tin cùng hỗ trợ.</p><aside>Quan sát khi đóng vai: Có ngắt lời không? Có công nhận cảm xúc không? Có hỏi nhu cầu trước khi đề nghị giúp không?</aside>`},
{chapter:'CHƯƠNG 4 · NƠI CÔNG CỘNG',title:'Tôn trọng không gian chung',scene:'public',content:`<p>Mỗi nơi có quy tắc khác nhau. Quan sát và hỏi khi chưa rõ giúp bạn chọn cách ứng xử phù hợp.</p><ul><li>Ở thư viện: giữ âm lượng phù hợp, trả đồ đúng chỗ.</li><li>Khi xếp hàng: chờ theo lượt, nhường theo hướng dẫn của nơi đó.</li><li>Trên phương tiện chung: chú ý chỗ đứng, âm thanh và lối đi.</li><li>Khi cần giúp: xưng hô lịch sự, nói rõ đề nghị và cảm ơn.</li></ul><blockquote>“Cô/chú cho em hỏi nơi trả sách ở đâu ạ? Em cảm ơn.”</blockquote><aside>Mức 1: Nhận biết quy tắc. Mức 2: Luyện hỏi và nhắc nhẹ. Mức 3: Tự điều chỉnh theo không gian đang sử dụng.</aside>`},
{chapter:'CHƯƠNG 4 · NƠI CÔNG CỘNG',title:'Góp ý và xử lý va chạm',content:`<h3>Khi người khác gây ảnh hưởng</h3><p>Giữ khoảng cách, nêu việc cụ thể và đề nghị vừa đủ. Tránh quay phim đăng lên mạng để gây sức ép.</p><blockquote>“Các bạn ơi, mình đang đọc và hơi khó tập trung. Các bạn có thể nói nhỏ hơn một chút được không?”</blockquote><h3>Khi bạn vô tình làm ảnh hưởng</h3><p>Xin lỗi, hỏi thăm và giúp khắc phục nếu người đó đồng ý.</p><blockquote>“Em xin lỗi vì đã va vào anh/chị. Anh/chị có sao không ạ? Em giúp nhặt đồ được không?”</blockquote><h3>Nếu tình huống căng thẳng</h3><p>Không tiếp tục tranh cãi hoặc xô đẩy. Rời khỏi tình huống khi có thể và nhờ nhân viên, người phụ trách hoặc người lớn đáng tin hỗ trợ.</p><aside>Đóng vai hai lượt: một lượt góp ý, một lượt nhận góp ý. Sau mỗi lượt, nói điều gì khiến mình cảm thấy được tôn trọng.</aside>`},
{chapter:'CHƯƠNG 5 · KHÔNG GIAN MẠNG',title:'Nghĩ thêm trước khi gửi',scene:'online',content:`<p>Người đọc không nghe được giọng nói hay nhìn nét mặt của bạn. Một câu ngắn dễ được hiểu theo nhiều cách.</p><h3>Ba câu hỏi trước khi gửi</h3><ul><li>Nội dung mình chia sẻ có đáng tin và cần thiết không?</li><li>Lời nói có tôn trọng người khác không?</li><li>Có ảnh hoặc thông tin riêng tư cần xin phép không?</li></ul><blockquote>“Mình có cách nhìn khác về điểm này, vì… Bạn có thể giải thích thêm lý do của bạn không?”</blockquote><aside>Mức 1: Nhận ra bình luận có thể gây tổn thương. Mức 2: Viết lại theo gợi ý. Mức 3: Tự kiểm tra trước khi đăng và sửa khi nhận ra sai sót.</aside>`},
{chapter:'CHƯƠNG 5 · KHÔNG GIAN MẠNG',title:'Hiểu nhầm và quyền riêng tư',content:`<h3>Khi tin nhắn gây hiểu nhầm</h3><p>Hỏi trước khi kết luận và giải thích ý định bằng câu đầy đủ.</p><blockquote>“Mình xin lỗi vì tin nhắn khiến bạn khó chịu. Ý mình là… Bạn cho mình biết chỗ nào khiến bạn hiểu như vậy nhé?”</blockquote><h3>Trước khi đăng ảnh của bạn</h3><p>Hỏi rõ về bức ảnh và nơi định đăng. Không đồng ý thì không đăng; im lặng không phải đồng ý.</p><blockquote>“Bạn có đồng ý để mình đăng ảnh này vào nhóm lớp không? Nếu không thì mình không đăng nhé.”</blockquote><ul><li>Không chia sẻ mật khẩu, mã xác minh, địa chỉ hay lịch trình riêng tư.</li><li>Đừng gửi ảnh riêng tư vì bị gây sức ép.</li><li>Nếu lỡ chia sẻ thông tin người khác, gỡ nội dung và trao đổi để khắc phục.</li></ul>`},
{chapter:'CHƯƠNG 5 · KHÔNG GIAN MẠNG',title:'Khi bị xúc phạm hoặc gây sức ép',content:`<p>Bạn không cần đáp trả bằng lời nặng nề hoặc tiếp tục một cuộc trò chuyện khiến mình không an toàn.</p><ol><li><b>Dừng tương tác:</b> Không tranh cãi để chứng minh bản thân.</li><li><b>Giữ bằng chứng:</b> Lưu tin nhắn hoặc hình ảnh cần thiết, không phát tán tiếp.</li><li><b>Dùng công cụ:</b> Chặn hoặc báo cáo tài khoản theo hướng dẫn của nền tảng.</li><li><b>Tìm hỗ trợ:</b> Nói với cha mẹ, giáo viên hoặc người lớn đáng tin.</li></ol><blockquote>“Mình không tiếp tục trao đổi khi có lời xúc phạm. Mình sẽ dừng cuộc trò chuyện này.”</blockquote><p>Nếu bạn chứng kiến, đừng hùa theo hoặc chia sẻ nội dung làm tổn thương. Có thể hỏi thăm riêng và giúp bạn tìm hỗ trợ.</p><aside>Nếu có đe dọa hoặc nguy hiểm trực tiếp, ưu tiên đến nơi an toàn và tìm người lớn hỗ trợ ngay.</aside>`},
{chapter:'CHƯƠNG 6 · VẬN DỤNG',title:'Từ một câu nói đến một thói quen',content:`<h3>Chọn một việc nhỏ trong tuần</h3><ul><li>Chào hỏi hoặc làm quen với một người bạn.</li><li>Nói rõ một nhu cầu với người thân.</li><li>Hỏi ý kiến trước khi chia sẻ ảnh.</li><li>Đọc lại một bình luận trước khi gửi.</li><li>Lắng nghe một người bạn mà chưa vội đưa lời khuyên.</li></ul><h3>Sau đó tự hỏi</h3><ol><li>Mình muốn đạt điều gì trong cuộc trao đổi?</li><li>Mình đã làm gì giúp người khác hiểu?</li><li>Mình đã lắng nghe ra sao?</li><li>Điều gì chưa phù hợp? Lần sau mình sẽ thay đổi gì?</li></ol><aside>Bạn không cần chấm điểm bản thân. Nhìn thấy một điều có thể điều chỉnh đã là một bước tiến.</aside>`},
{chapter:'CHƯƠNG 6 · VẬN DỤNG',title:'Khi cần thêm một người hỗ trợ',content:`<p>Một số vấn đề khó giải quyết chỉ bằng việc chọn lời nói. Khi liên tục bị ép buộc, bắt nạt, đe dọa hoặc cảm thấy không an toàn, hãy tìm người lớn đáng tin.</p><h3>Cách mở đầu</h3><blockquote>“Em đang gặp một chuyện làm em lo. Em muốn nhờ cô/thầy nghe và giúp em nghĩ cách xử lý.”</blockquote><h3>Nói những điều bạn nhớ</h3><ul><li>Điều gì đã xảy ra và khi nào?</li><li>Việc đó đang ảnh hưởng đến bạn thế nào?</li><li>Bạn đã thử làm gì?</li><li>Bạn mong nhận được sự hỗ trợ nào?</li></ul><p>Nếu người đầu tiên chưa giúp được, thử tìm người lớn đáng tin khác. Bạn có quyền được lắng nghe và được hỗ trợ.</p><aside>Chatbot có thể giúp bạn nghĩ cách diễn đạt. Với tình huống liên quan đến an toàn, hãy tìm sự hỗ trợ từ người thật.</aside>`},
{chapter:'GHI CHÚ CUỐI SÁCH',title:'Về cuốn cẩm nang',content:`<p>Cuốn sách được biên soạn cho website Nói lời hay, theo định hướng của đề tài “Xây dựng giải pháp phát triển năng lực giao tiếp và ứng xử cho học sinh trung học cơ sở”.</p><p>Các tình huống và câu mẫu là nội dung luyện tập do website biên soạn. Ba mức luyện tập dùng để tổ chức hoạt động, không thay thế công cụ đo lường năng lực hoặc kết quả khảo sát.</p><h3>Năm nhóm kỹ năng được luyện</h3><ul><li>Thiết lập quan hệ.</li><li>Bày tỏ ý kiến và từ chối phù hợp.</li><li>Chia sẻ suy nghĩ, cảm xúc.</li><li>Hỗ trợ cảm xúc cho người khác.</li><li>Giải quyết bất đồng.</li></ul><aside>Luyện cùng người khác, nhận phản hồi và vận dụng vào cuộc sống sẽ giúp cuốn sách trở nên hữu ích hơn.</aside>`}
];

{title:'Câu nói nào mở được cuộc trò chuyện?',scene:'school',content:`<h3>Bài luyện 1 · Viết lại lời nói</h3><p>Hãy đổi ba câu sau thành lời nói rõ ràng, tôn trọng:</p><ol><li>“Bạn lúc nào cũng làm sai!”</li><li>“Thôi, muốn làm gì thì làm!”</li><li>“Không biết, đừng hỏi mình!”</li></ol><h3>Một cách viết lại</h3><ol><li>“Phần này chưa đúng yêu cầu. Mình cùng xem lại nhé?”</li><li>“Mình chưa đồng ý với cách này. Mình muốn nhóm so sánh thêm một phương án.”</li><li>“Mình chưa hiểu phần đó. Mình có thể cùng bạn hỏi thầy/cô.”</li></ol><aside>Vì sao? Câu mới nói vào sự việc, nêu nhu cầu và mở ra bước tiếp theo. Bạn có thể viết khác, miễn vẫn rõ ý và tôn trọng.</aside>`},
{title:'Luyện nhìn từ hai phía',scene:'school',content:`<h3>Tình huống</h3><p>Lan muốn làm bài nhóm ngay. Minh muốn đọc kỹ yêu cầu trước. Hai bạn bắt đầu khó chịu vì nghĩ người kia không hợp tác.</p><div class="story-dialogue"><p><b>Lan:</b> “Mình lo không kịp, nên muốn bắt đầu ngay.”</p><p><b>Minh:</b> “Mình cũng muốn làm kịp, nhưng lo làm sai đề.”</p><p><b>Lan:</b> “Vậy mình đọc cùng nhau 5 phút rồi chia việc nhé?”</p><p><b>Minh:</b> “Được. Mình sẽ ghi các yêu cầu chính.”</p></div><h3>Cách xử lý</h3><ol><li>Nói điều mình lo, không quy kết người kia.</li><li>Nhận ra cả hai cùng muốn hoàn thành bài.</li><li>Thống nhất việc cụ thể và thời gian.</li></ol><aside>Bài luyện: Nếu chỉ còn 15 phút, hai bạn có thể chọn phương án nào? Nêu một đề nghị và giải thích vì sao phù hợp.</aside>`}],
'CHƯƠNG 2 · GIA ĐÌNH':[
{title:'Một buổi tối chưa hiểu nhau',scene:'family',content:`<h3>Chuyện của An</h3><p>An vừa về nhà sau ngày học dài. Mẹ thấy An dùng điện thoại và nghĩ An chưa muốn học.</p><div class="story-dialogue"><p><b>Mẹ:</b> “Con cất điện thoại và học ngay đi.”</p><p><b>An:</b> “Con đang khá mệt. Con xin nghỉ 15 phút rồi học lúc 7 giờ được không ạ?”</p><p><b>Mẹ:</b> “Mẹ lo con nghỉ rồi quên giờ.”</p><p><b>An:</b> “Con đặt báo giờ và để điện thoại ngoài bàn. Đến giờ con sẽ bắt đầu.”</p></div><h3>Cách xử lý từng bước</h3><ol><li>Nói cảm xúc và nhu cầu bằng giọng bình tĩnh.</li><li>Nghe điều mẹ đang lo.</li><li>Đưa phương án cụ thể thay vì chỉ đòi được nghỉ.</li><li>Thực hiện điều đã thống nhất.</li></ol><aside>Nếu chưa được đồng ý: hỏi xem có thể nghỉ ngắn hơn, đổi cách nghỉ hoặc trao đổi lại khi cả hai bình tĩnh.</aside>`},
{title:'Bài luyện · Xin phép và thương lượng',scene:'family',content:`<h3>Tình huống</h3><p>Bạn có lịch học nhóm vào chiều thứ Bảy, nhưng gia đình muốn bạn cùng đi thăm người thân. Hãy thực hành ba mức:</p><div class="level"><b>Mức 1 · Nhận biết</b><p>Nêu điều bạn cần và điều người thân có thể mong muốn.</p></div><div class="level"><b>Mức 2 · Có gợi ý</b><p>Hoàn thành: “Con đã hẹn… Con muốn… Mình có thể… được không ạ?”</p></div><div class="level"><b>Mức 3 · Vận dụng</b><p>Đề xuất hai cách sắp xếp. Chọn cách khả thi và giải thích.</p></div><h3>Gợi ý tự đối chiếu</h3><p>Có thể đổi giờ học nhóm nếu các bạn đồng ý, hoặc cùng gia đình đi vào thời điểm khác nếu phù hợp. Đừng tự đổi kế hoạch của người khác khi chưa hỏi.</p><aside>Đóng vai: Người thân chưa đồng ý ở lượt đầu. Bạn hỏi lý do và thử một phương án thứ hai.</aside>`},
{title:'Khi bị so sánh với người khác',scene:'family',content:`<p>Bạn nghe: “Sao con không học tốt như bạn ấy?” Bạn buồn và muốn được góp ý theo tiến bộ của chính mình.</p><h3>Cách có thể thử</h3><ol><li>Chọn lúc bình tĩnh và xin được nói một điều.</li><li>Nêu câu nói cụ thể và cảm xúc của mình.</li><li>Nói rõ kiểu hỗ trợ mình mong muốn.</li><li>Đề nghị một kế hoạch học tập vừa sức.</li></ol><blockquote>“Khi nghe con bị so sánh với bạn, con thấy buồn. Con muốn bố mẹ cùng xem phần con chưa hiểu và giúp con đặt mục tiêu cho tuần này.”</blockquote><h3>Bài luyện</h3><p>Viết lại câu: “Bố mẹ chỉ biết so sánh!” bằng cách nói về cảm xúc và một đề nghị. Đọc thành tiếng rồi sửa từ nào dễ làm cuộc nói chuyện căng hơn.</p><aside>Nếu khó mở lời, bạn có thể viết một tin nhắn hoặc nhờ người lớn đáng tin hỗ trợ cuộc trao đổi.</aside>`}],
'CHƯƠNG 3 · NHÀ TRƯỜNG':[
{title:'Bạn thân nhờ chép bài',scene:'school',content:`<h3>Chuyện của Mai và Huy</h3><p>Sắp tới giờ nộp bài, Huy nhờ Mai gửi toàn bộ đáp án.</p><div class="story-dialogue"><p><b>Huy:</b> “Gửi bài cho mình chép với. Bạn thân mà!”</p><p><b>Mai:</b> “Mình không gửi bài để chép được. Nhưng mình có thể chỉ cách làm câu bạn đang vướng.”</p><p><b>Huy:</b> “Bạn không giúp mình à?”</p><p><b>Mai:</b> “Mình muốn giúp bạn hiểu bài. Mình vẫn không đồng ý cho chép. Bạn muốn xem câu nào?”</p></div><h3>Cách xử lý</h3><ol><li>Từ chối rõ yêu cầu không phù hợp.</li><li>Đề nghị hỗ trợ khác trong khả năng.</li><li>Nếu bị gây sức ép, nhắc lại ranh giới, không tranh cãi dài.</li></ol><aside>Bài luyện: Đổi yêu cầu thành “Nói dối giúp mình với cô”. Bạn sẽ từ chối thế nào? Lời nói có rõ ràng và tôn trọng không?</aside>`},
{title:'Bài luyện · Khi nhóm chưa thống nhất',scene:'school',content:`<p>Nhóm có 4 bạn. Hai bạn muốn làm poster, hai bạn muốn quay video. Hạn nộp là ngày mai.</p><h3>Chọn một cách xử lý</h3><ol class="letter-options"><li>A. Chê phương án của bên kia rồi tự quyết.</li><li>B. So sánh thời gian, yêu cầu bài và nguồn lực trước khi chọn.</li><li>C. Không làm nữa vì nhóm không nghe mình.</li></ol><h3>Giải thích</h3><p>B giúp nhóm trao đổi theo tiêu chí thay vì thắng thua. Hãy nghe lý do mỗi bên, liệt kê việc phải làm và chọn cách có thể hoàn thành.</p><blockquote>“Mỗi bạn nói một ưu điểm và một khó khăn của phương án. Mình cùng chọn theo yêu cầu bài và thời gian còn lại nhé?”</blockquote><aside>Luyện viết: Soạn 2 câu để mời bạn ít nói góp ý. Đóng vai người điều phối và hỏi mỗi người một lượt.</aside>`},
{title:'Khi bị trêu và không thấy vui',scene:'school',content:`<p>Một bạn gọi bạn bằng biệt danh khiến bạn khó chịu. Bạn đã im lặng vài lần nhưng việc vẫn lặp lại.</p><h3>Cách xử lý cụ thể</h3><ol><li>Nói rõ hành vi: “Bạn gọi mình bằng tên đó…”.</li><li>Nêu ranh giới: “Mình không thấy vui và muốn bạn dừng lại.”</li><li>Nếu tiếp tục, rời cuộc trao đổi và tìm giáo viên hoặc người lớn đáng tin hỗ trợ.</li><li>Ghi lại sự việc cần thiết để trình bày rõ.</li></ol><blockquote>“Mình không thích bị gọi bằng biệt danh đó. Bạn gọi tên mình nhé. Nếu việc này tiếp tục, mình sẽ nhờ cô hỗ trợ.”</blockquote><h3>Nếu bạn là người chứng kiến</h3><p>Đừng hùa theo. Có thể nói: “Bạn ấy đã nói không thích, mình dừng lại nhé” nếu an toàn, rồi hỏi thăm và giúp bạn tìm hỗ trợ.</p><aside>Bài luyện: Phân biệt “mình không thấy vui” với lời công kích. Chọn một câu thể hiện ranh giới mà không xúc phạm.</aside>`}],
'CHƯƠNG 4 · NƠI CÔNG CỘNG':[
{title:'Một lời nhắc trong thư viện',scene:'public',content:`<p>Tuấn cần đọc sách để làm bài. Nhóm bàn bên nói chuyện lớn.</p><div class="story-dialogue"><p><b>Tuấn:</b> “Các bạn ơi, mình hơi khó tập trung. Các bạn nói nhỏ hơn một chút được không?”</p><p><b>Bạn bên cạnh:</b> “Tụi mình không để ý. Xin lỗi nhé.”</p><p><b>Tuấn:</b> “Cảm ơn các bạn.”</p></div><h3>Nếu lời nhắc chưa có tác dụng</h3><p>Không tăng giọng hoặc xúc phạm. Bạn có thể đổi chỗ nếu phù hợp, hoặc nhờ nhân viên thư viện hỗ trợ giữ quy tắc chung.</p><h3>Bài luyện</h3><p>Viết một lời nhắc khi có người chắn lối đi. Lời nhắc cần có cách xưng hô phù hợp, nêu yêu cầu cụ thể và giữ giọng bình tĩnh.</p><aside>Một cách nói: “Anh/chị cho em xin đi qua lối này một chút được không ạ? Em cảm ơn.”</aside>`},
{title:'Bài luyện · Chờ theo lượt',scene:'public',content:`<p>Bạn đang xếp hàng mua vé. Một người chen lên trước và nói mình đang vội.</p><h3>Cân nhắc ba lựa chọn</h3><ul><li>Đẩy người đó ra.</li><li>Nhắc lịch sự về hàng chờ và nhờ nhân viên hỗ trợ nếu cần.</li><li>Quay video để đăng và khiến người đó xấu hổ.</li></ul><h3>Cách có thể thử</h3><blockquote>“Dạ mọi người đang chờ theo hàng từ phía sau. Anh/chị xếp theo lượt giúp em được không ạ?”</blockquote><p>Nếu người đó phản ứng căng thẳng, không xô đẩy hoặc tranh cãi tiếp. Nhờ người phụ trách xử lý quy tắc tại nơi đó.</p><aside>Bài luyện: Một bạn đóng vai người đang vội, một bạn nhắc quy tắc, một bạn làm nhân viên. Sau đó đổi vai và trao đổi cách nào giúp giảm căng thẳng.</aside>`}],
'CHƯƠNG 5 · KHÔNG GIAN MẠNG':[
{title:'Một bình luận có thể viết lại',scene:'online',content:`<p>Linh không đồng ý với bài đăng của Nam và định viết: “Bạn chẳng biết gì cả!”</p><div class="story-dialogue"><p><b>Linh:</b> “Mình có cách nhìn khác về ý này, vì… Bạn có thể chia sẻ nguồn bạn đã đọc không?”</p><p><b>Nam:</b> “Mình mới xem một bài, chưa kiểm tra kỹ.”</p><p><b>Linh:</b> “Mình cùng xem thêm nguồn rồi trao đổi nhé.”</p></div><h3>Cách xử lý</h3><ol><li>Phản hồi vào ý kiến, không đánh giá con người.</li><li>Nêu lý do thay vì chỉ nói “sai”.</li><li>Hỏi nguồn nếu đó là thông tin cần kiểm tra.</li><li>Đọc lại trước khi gửi; dừng nếu cuộc trao đổi chuyển sang xúc phạm.</li></ol><aside>Bài luyện: Viết lại “Nói vậy mà cũng nói!”. Gợi ý: nêu điểm bạn chưa đồng ý và một câu hỏi làm rõ.</aside>`},
{title:'Bài luyện · Xin phép trước khi đăng',scene:'online',content:`<p>Bạn chụp được ảnh một bạn ngủ gật trên xe và muốn đăng vào nhóm lớp “cho vui”.</p><h3>Hãy trả lời</h3><ol><li>Bức ảnh có thể khiến bạn ấy cảm thấy thế nào?</li><li>Nhóm kín có đồng nghĩa với việc được phép đăng không?</li><li>Nếu bạn ấy không đồng ý, bạn sẽ làm gì?</li></ol><h3>Gợi ý tự đối chiếu</h3><p>Không đăng khi chưa có sự đồng ý. Ảnh có thể bị chia sẻ lại, dù ban đầu chỉ ở nhóm kín. Nếu bạn ấy từ chối, tôn trọng lựa chọn và không gây sức ép.</p><blockquote>“Bạn có đồng ý để mình đăng ảnh này vào nhóm không? Nếu không thì mình không đăng.”</blockquote><aside>Nếu đã lỡ đăng: gỡ ảnh, nhận trách nhiệm, xin lỗi và đề nghị những người đã chia sẻ gỡ nội dung. Không đổ lỗi vì “chỉ đùa thôi”.</aside>`},
{title:'Khi nhóm chat làm bạn áp lực',scene:'online',content:`<p>Một nhóm yêu cầu bạn gửi thông tin riêng tư để “chứng minh tình bạn”. Bạn thấy không thoải mái.</p><h3>Cách xử lý từng bước</h3><ol><li>Không gửi thông tin riêng tư vì bị gây sức ép.</li><li>Từ chối ngắn gọn, rõ ràng.</li><li>Rời hoặc tắt thông báo nhóm nếu cần.</li><li>Nếu có đe dọa, lưu bằng chứng và tìm người lớn đáng tin hỗ trợ.</li></ol><blockquote>“Mình không chia sẻ thông tin riêng tư. Mình mong các bạn tôn trọng điều đó.”</blockquote><h3>Bài luyện</h3><p>Viết câu trả lời khi bị nói: “Không gửi thì nghỉ chơi!”. Câu trả lời cần giữ ranh giới, không xúc phạm và không tiếp tục thương lượng về thông tin riêng tư.</p><aside>Một tình bạn tôn trọng không cần bạn đánh đổi sự riêng tư để chứng minh.</aside>`}],
'CHƯƠNG 6 · VẬN DỤNG':[
{title:'Thử thách 7 ngày · Từng bước nhỏ',scene:'school',content:`<ol><li><b>Ngày 1:</b> Chào hỏi một người bằng lời phù hợp.</li><li><b>Ngày 2:</b> Lắng nghe một câu chuyện, hỏi một câu làm rõ.</li><li><b>Ngày 3:</b> Bày tỏ một nhu cầu với người thân.</li><li><b>Ngày 4:</b> Viết một lời từ chối lịch sự.</li><li><b>Ngày 5:</b> Đọc lại một tin nhắn trước khi gửi.</li><li><b>Ngày 6:</b> Hỏi nhu cầu trước khi đưa lời khuyên.</li><li><b>Ngày 7:</b> Nhìn lại một cuộc trao đổi và chọn điều muốn luyện tiếp.</li></ol><h3>Ghi lại bằng 3 câu</h3><p>Hôm nay mình đã thử…<br>Điều có ích là…<br>Lần sau mình muốn…</p><aside>Chọn hoạt động phù hợp và an toàn. Nếu chưa có cơ hội trong đời sống, bạn có thể đóng vai trong tiết học.</aside>`}]

const enriched={"CHƯƠNG 1 · NỀN TẢNG":[{"title":"Đọc tín hiệu, chọn cách mở lời","content":"<p>Cùng một lời nói có thể phù hợp với bạn bè nhưng cần đổi cách xưng hô khi nói với người lớn. Trước khi mở lời, quan sát hoàn cảnh và hỏi xem người kia có sẵn sàng nghe không.</p><h3>Ba điều cần cân nhắc</h3><ol><li><b>Người đối diện:</b> bạn bè, người thân hay người chưa quen?</li><li><b>Thời điểm:</b> người ấy đang bận, mệt hay có thể trao đổi?</li><li><b>Mục đích:</b> hỏi thông tin, đề nghị giúp đỡ hay giải quyết hiểu nhầm?</li></ol><div class=\"story-dialogue\"><p><b>Với bạn:</b> “Bạn có vài phút để nghe mình góp ý không?”</p><p><b>Với cô:</b> “Thưa cô, em có điều chưa hiểu. Khi nào em có thể hỏi cô ạ?”</p></div><aside>Bài luyện: Viết hai lời mở đầu cho cùng một việc: xin đổi chỗ ngồi. Một câu nói với bạn, một câu nói với giáo viên. Giải thích cách xưng hô của mình.</aside>"},{"title":"Góp ý vào việc, không chê con người","content":"<p>Góp ý hữu ích giúp người kia biết điều có thể sửa. Tránh các nhãn như “lười”, “vô dụng” hoặc “lúc nào cũng…”.</p><h3>Thử công thức ba bước</h3><ol><li>Nêu sự việc quan sát được: “Phần của bạn chưa có nguồn”.</li><li>Nói ảnh hưởng: “Nhóm khó kiểm tra thông tin”.</li><li>Đề nghị cụ thể: “Bạn bổ sung nguồn trước tối nay nhé?”.</li></ol><blockquote>“Mình thấy phần hình ảnh chưa ghi nguồn. Bạn bổ sung đường dẫn để nhóm kiểm tra được không?”</blockquote><h3>Khi nhận góp ý</h3><p>Nghe hết ý, hỏi điều chưa rõ và chọn việc cần sửa. Nếu lời góp ý xúc phạm, có thể đề nghị người kia nói vào sự việc.</p><aside>Bài luyện: Viết lại “Bạn làm ẩu quá!”. Gợi ý: nêu đúng phần chưa đạt, ảnh hưởng và một việc có thể làm tiếp.</aside>"}],"CHƯƠNG 2 · GIA ĐÌNH":[{"title":"Chia việc nhà, giữ lời đã hẹn","content":"<p>Nam nhận rửa bát nhưng quên vì mải chơi. Em gái phải làm thay và thấy không công bằng.</p><div class=\"story-dialogue\"><p><b>Em:</b> “Anh hứa rồi mà lại để em làm!”</p><p><b>Nam:</b> “Anh đã quên việc của mình. Anh xin lỗi. Anh sẽ lau bàn và rửa bát bữa tối, em thấy có phù hợp không?”</p><p><b>Em:</b> “Lần sau anh nhớ làm đúng lượt nhé.”</p></div><h3>Cách giải quyết</h3><ol><li>Nhận đúng việc mình chưa làm, không đổ lỗi.</li><li>Hỏi xem việc khắc phục có phù hợp với người bị ảnh hưởng.</li><li>Ghi lịch hoặc đặt nhắc giờ để thực hiện.</li><li>Báo sớm nếu có lý do cần đổi lượt.</li></ol><aside>Bài luyện: Nếu bạn có bài kiểm tra vào sáng mai, hãy đề nghị đổi lượt với anh/chị. Câu nói cần có lý do, phương án và sự đồng ý của người kia.</aside>"},{"title":"Chia sẻ chuyện khó nói với người thân","content":"<p>Bạn bị bạn bè trêu nhưng ngại kể vì sợ bị trách. Bạn có thể bắt đầu bằng một chuyện cụ thể, không cần kể mọi điều cùng lúc.</p><blockquote>“Con có chuyện ở lớp làm con lo. Con muốn bố/mẹ nghe con kể trước, rồi cùng con nghĩ cách xử lý được không ạ?”</blockquote><h3>Chuẩn bị để mở lời</h3><ol><li>Chọn người lớn bạn tin và một nơi riêng tư.</li><li>Nói điều đã xảy ra, cảm xúc và điều mình cần.</li><li>Nếu khó nói trực tiếp, viết vài dòng hoặc xin hỗ trợ từ giáo viên.</li><li>Nếu chưa được lắng nghe, tìm người lớn đáng tin khác.</li></ol><h3>Bài luyện</h3><p>Hoàn thành: “Điều xảy ra là… Điều làm con lo là… Con mong được giúp…”. Dùng tình huống giả định khi luyện trước lớp.</p><aside>Khi có đe dọa hoặc nguy hiểm, tìm hỗ trợ ngay. Bạn không cần đợi chuẩn bị được một lời kể hoàn hảo.</aside>"}],"CHƯƠNG 3 · NHÀ TRƯỜNG":[{"title":"Hỏi thầy cô khi chưa hiểu bài","content":"<p>Chưa hiểu bài là một lý do để hỏi, không phải điều đáng xấu hổ. Nói rõ phần mình đã thử sẽ giúp thầy cô hỗ trợ đúng chỗ.</p><div class=\"story-dialogue\"><p><b>Vy:</b> “Thưa cô, em hiểu bước đầu nhưng chưa biết vì sao đổi dấu ở bước này.”</p><p><b>Cô:</b> “Em chỉ vào chỗ chưa rõ nhé.”</p><p><b>Vy:</b> “Dạ ở dòng thứ hai. Em đã thử làm lại nhưng vẫn bị sai.”</p></div><h3>Ba bước hỏi rõ</h3><ol><li>Xin phép vào thời điểm phù hợp.</li><li>Nêu phần đã hiểu và đúng chỗ đang vướng.</li><li>Nhắc lại hướng dẫn, thử một ví dụ để kiểm tra.</li></ol><blockquote>“Em hiểu là mình cần… trước, rồi mới… Em hiểu đúng chưa ạ?”</blockquote><aside>Bài luyện: Thay “Em không hiểu gì cả” bằng câu hỏi cụ thể về một bước. Nếu thầy/cô đang bận, xin một thời điểm khác để hỏi.</aside>"},{"title":"Đứng cùng bạn khi có người hùa theo","content":"<p>Trong giờ ra chơi, một nhóm cười nhạo bài thuyết trình của Hà. Bạn muốn giúp nhưng cũng sợ bị trêu.</p><h3>Chọn việc an toàn trong khả năng</h3><ol><li>Không cười theo, không quay hay phát tán đoạn trêu chọc.</li><li>Nếu an toàn, nhắc ngắn: “Mình góp ý vào bài, đừng chế giễu bạn”.</li><li>Hỏi thăm riêng: “Bạn muốn mình đi cùng tìm cô không?”.</li><li>Báo giáo viên khi việc lặp lại hoặc có đe dọa.</li></ol><div class=\"story-dialogue\"><p><b>Bạn:</b> “Mình thấy chuyện vừa rồi khó chịu. Bạn có muốn mình ngồi cùng một lát không?”</p><p><b>Hà:</b> “Mình muốn nói với cô.”</p><p><b>Bạn:</b> “Mình có thể đi cùng bạn.”</p></div><aside>Bài luyện: Chọn hai việc người chứng kiến có thể làm. Giải thích vì sao không nên đối đầu một mình với nhóm đang đe dọa.</aside>"}],"CHƯƠNG 4 · NƠI CÔNG CỘNG":[{"title":"Hỏi đường và nhờ giúp khi bị lạc","content":"<p>Khi không tìm thấy người đi cùng, ưu tiên nơi an toàn và người có nhiệm vụ hỗ trợ: nhân viên quầy thông tin, bảo vệ hoặc người phụ trách.</p><h3>Làm từng bước</h3><ol><li>Dừng ở nơi dễ nhận biết, tránh đi tìm lung tung.</li><li>Đến quầy hoặc người phụ trách để xin giúp.</li><li>Nói ngắn điều đang cần, không công khai thông tin riêng tư với đám đông.</li><li>Nhờ liên lạc với người đi cùng; không đi theo người lạ tới nơi vắng.</li></ol><blockquote>“Cô/chú ơi, em không tìm thấy người đi cùng. Cô/chú giúp em liên lạc tại quầy thông tin được không ạ?”</blockquote><h3>Bài luyện</h3><p>Đóng vai hỏi nơi trả sách ở thư viện và nhờ hỗ trợ khi bị lạc. Cách nói có xin phép, nêu rõ nhu cầu và cảm ơn không?</p><aside>Nếu cảm thấy bị đe dọa, tìm người phụ trách hỗ trợ ngay; không cần cố giữ một cuộc trao đổi lịch sự với người gây nguy hiểm.</aside>"},{"title":"Nhận góp ý và sửa điều mình gây ra","content":"<p>Bạn mở video lớn trên xe. Người ngồi cạnh nhắc vì đang cần nghỉ.</p><div class=\"story-dialogue\"><p><b>Người bên cạnh:</b> “Em có thể giảm âm lượng không?”</p><p><b>Bạn:</b> “Dạ em xin lỗi, em không để ý. Em tắt tiếng ngay ạ.”</p></div><h3>Cách ứng xử phù hợp</h3><ol><li>Nghe yêu cầu, tránh phản ứng bằng lời thách thức.</li><li>Điều chỉnh hành vi ngay khi có thể.</li><li>Xin lỗi ngắn gọn nếu mình gây ảnh hưởng.</li><li>Quan sát quy tắc để tránh lặp lại.</li></ol><h3>Nếu lời nhắc chưa rõ</h3><p>Hỏi lại bình tĩnh: “Dạ cô/chú muốn em nhường lối bên này phải không ạ?”. Nếu bị xúc phạm hoặc đe dọa, tìm người phụ trách hỗ trợ.</p><aside>Bài luyện: Viết hai câu đáp lại khi bạn để cặp chắn lối đi. Gợi ý: nhận ra ảnh hưởng và chuyển cặp sang chỗ phù hợp.</aside>"}],"CHƯƠNG 5 · KHÔNG GIAN MẠNG":[{"title":"Tin nhắn gấp chưa chắc đáng tin","content":"<p>Một tài khoản tự nhận là bạn học nhắn: “Gửi mã xác minh giúp mình ngay!”. Dù ảnh đại diện quen thuộc, bạn vẫn cần kiểm tra.</p><h3>Dừng – Kiểm tra – Tìm hỗ trợ</h3><ol><li>Không gửi mật khẩu, mã xác minh hoặc thông tin thanh toán.</li><li>Không vội mở liên kết lạ hay tải tệp được thúc giục.</li><li>Liên hệ người bạn qua cách đã biết để xác nhận.</li><li>Báo cáo tài khoản đáng ngờ, nhờ người lớn hỗ trợ nếu đã lỡ làm theo.</li></ol><blockquote>“Mình không chia sẻ mã xác minh. Mình sẽ gọi bạn qua số đã lưu để kiểm tra.”</blockquote><h3>Bài luyện</h3><p>Gạch chân dấu hiệu cần kiểm tra trong tin nhắn: “Chỉ còn 5 phút, bấm link nhận quà và gửi mã!”. Đề xuất một phản hồi an toàn.</p><aside>Không cần làm theo chỉ vì người gửi hối thúc, dọa mất tài khoản hoặc hứa tặng quà. Mã xác minh là thông tin riêng của bạn.</aside>"},{"title":"Làm rõ hiểu nhầm trong nhóm chat","content":"<p>Duy viết “Tùy bạn” khi đang bận. An nghĩ Duy giận và không muốn tham gia bài nhóm.</p><div class=\"story-dialogue\"><p><b>An:</b> “Mình đọc câu đó hơi khó hiểu. Bạn muốn mình tự chọn hay đang chưa đồng ý?”</p><p><b>Duy:</b> “Mình đang bận nên nhắn ngắn. Mình đồng ý để bạn chọn ảnh.”</p><p><b>An:</b> “Vậy mình chọn ảnh rồi gửi bạn xem lại nhé.”</p></div><h3>Cách giảm hiểu nhầm</h3><ol><li>Hỏi ý nghĩa, tránh đoán cảm xúc qua một câu ngắn.</li><li>Giải thích bằng câu đầy đủ, nhận phần mình diễn đạt chưa rõ.</li><li>Thống nhất việc tiếp theo; chuyển sang trao đổi trực tiếp nếu cần.</li></ol><aside>Bài luyện: Viết lại “Sao cũng được” thành câu rõ ý trong hai trường hợp: bạn đồng ý với mọi lựa chọn; bạn cần thời gian suy nghĩ.</aside>"}],"CHƯƠNG 6 · VẬN DỤNG":[{"title":"Phiếu luyện một cuộc trò chuyện","content":"<p>Chọn một tình huống giả định hoặc một việc nhỏ phù hợp để luyện. Viết ngắn rồi thử nói thành tiếng.</p><div class=\"workbox\"><b>1. Sự việc và mục tiêu</b><p>Điều xảy ra là… Mình muốn cuộc trao đổi giúp…</p></div><div class=\"workbox\"><b>2. Hai phía đang cần gì?</b><p>Mình cần… Người kia có thể cần… Mình sẽ hỏi…</p></div><div class=\"workbox\"><b>3. Một câu mở đầu</b><p>Khi… mình cảm thấy… Mình đề nghị… Bạn nghĩ sao?</p></div><div class=\"workbox\"><b>4. Nếu chưa được đồng ý</b><p>Mình sẽ hỏi lý do, đề xuất… hoặc tìm hỗ trợ từ…</p></div><h3>Tự đối chiếu</h3><p>□ Nói vào sự việc. □ Nêu đề nghị cụ thể. □ Để người kia trả lời. □ Giữ ranh giới và an toàn.</p><aside>Câu mẫu chỉ là gợi ý. Hãy dùng cách xưng hô và lời nói tự nhiên với mình; không cần học thuộc từng chữ.</aside>"},{"title":"Đóng vai, phản hồi và luyện lại","content":"<p>Mỗi nhóm ba người: người mở lời, người đối diện và người quan sát. Dùng chuyện giả định; không ép ai kể trải nghiệm riêng tư.</p><h3>Một lượt luyện khoảng 5 phút</h3><ol><li>Đọc tình huống, xác định mục tiêu và nhu cầu hai phía.</li><li>Đóng vai hai lượt nói, gồm cả một lời chưa đồng ý.</li><li>Người quan sát nêu một điều hiệu quả và một góp ý cụ thể.</li><li>Luyện lại với câu đã điều chỉnh, rồi đổi vai.</li></ol><blockquote>“Mình thấy bạn đã hỏi lý do trước khi trả lời. Lần sau bạn có thể nói rõ thời gian trong đề nghị.”</blockquote><h3>Câu hỏi sau hoạt động</h3><p>Câu nào giúp người kia dễ trả lời? Điều gì làm cuộc nói chuyện căng? Nếu có nguy hiểm, ai có thể hỗ trợ?</p><aside>Không chấm điểm con người hoặc so sánh giữa các bạn. Phản hồi vào hành vi có thể quan sát và điều có thể luyện tiếp.</aside>"}]}; for(let i=bookPages.length-1;i>=0;i--){const p=bookPages[i];if(enriched[p.chapter]&&(i===bookPages.length-1||bookPages[i+1].chapter!==p.chapter))bookPages.splice(i+1,0,...enriched[p.chapter].map(x=>({...x,chapter:p.chapter})));}

function turnBook(i){if(!Number.isInteger(i)||i<0||i>=bookPages.length||i===bookIndex)return;const paper=readerDialog.querySelector('.screen-paper');const forward=i>bookIndex;paper.classList.remove('flip-next','flip-prev');bookIndex=i;localStorage.setItem("nlh-book-page",String(i));renderReader();void paper.offsetWidth;paper.classList.add(forward?'flip-next':'flip-prev');clearTimeout(readerFlipTimer);readerFlipTimer=setTimeout(()=>paper.classList.remove('flip-next','flip-prev'),400)}

function book(id){const mapped=chapterStarts.find(([n])=>({family:'Gia đình',school:'Nhà trường',public:'Nơi công cộng',online:'Không gian mạng'}[id]===n));app.innerHTML=`<section class="book-shelf"><div class="shelf-copy"><div class="eyebrow">Cẩm nang điện tử · Khổ A4</div><h1>Mở sách.<br><span class="blue">Luyện từng cuộc<br>trò chuyện.</span></h1><p class="muted">${bookPages.length} trang có hình minh họa, câu chuyện đối thoại, hướng dẫn từng bước và bài luyện theo bốn bối cảnh.</p><button id="openHandbook">${bookIndex?'Tiếp tục đọc sách':'Mở cẩm nang'}</button><button id="shelfPrint" class="secondary">In / Lưu PDF A4</button><p class="shelf-note">Bấm bìa để mở · Lật từng trang · Chọn chương từ mục lục</p></div><button class="shelf-book palette-school" id="coverBook" aria-label="Mở cuốn cẩm nang Nói lời hay"><div class="shelf-spine"></div><small>CẨM NANG GIAO TIẾP & ỨNG XỬ</small><h2>Nói lời hay</h2><p>Tự tin bày tỏ.<br>Biết lắng nghe.</p>${pageIllustration(bookPages[0],0)}<span>DÀNH CHO HỌC SINH LỚP 6–9</span></button></section><div class="chapter-buttons"><h2>Bạn muốn đọc chương nào?</h2><div>${chapterStarts.slice(1).map(([n,i])=>`<button class="secondary" data-openchapter="${i}">${n}</button>`).join('')}</div></div>`;document.querySelector('#openHandbook').onclick=()=>openBook(mapped?.[1]??bookIndex);document.querySelector('#coverBook').onclick=()=>openBook(mapped?.[1]??0);document.querySelector('#shelfPrint').onclick=bookPrint;document.querySelectorAll('[data-openchapter]').forEach(b=>b.onclick=()=>openBook(Number(b.dataset.openchapter)))}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing-book'));window.addEventListener('keydown',e=>{if(!readerDialog?.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();turnBook(bookIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();turnBook(bookIndex-1)}});

function classroom(){app.innerHTML=`<div class="guide"><div class="eyebrow">TRONG TIẾT HỌC</div><h1 style="font-size:42px">Thử một cuộc trò chuyện.</h1><p>Chia nhóm 3 người: một người đóng vai học sinh, một người đóng vai người đối diện, một người quan sát. Mỗi lượt 3–5 phút, sau đó đổi vai.</p><ol><li>Đọc tình huống và xác định nhu cầu của mỗi phía.</li><li>Đóng vai hai lượt nói; thử một cách phản hồi tôn trọng.</li><li>Người quan sát nêu một điều hiệu quả và một gợi ý cụ thể.</li><li>Luyện lại, rồi ghi câu nói bạn muốn mang vào cuộc sống.</li></ol><p class="muted">Dùng tình huống giả định. Không yêu cầu học sinh kể trải nghiệm riêng tư trước lớp.</p></div><button class="noprint" onclick="window.print()">In thẻ đóng vai</button><div class="rolecards" style="margin-top:25px">${scenarios.map(s=>`<article class="rolecard"><span class="tag">${group(s.group).name.toUpperCase()}</span><h3>${s.title}</h3><p>${s.story}</p><p><b>Vai 1:</b> Bày tỏ cảm xúc, nhu cầu và một đề nghị.</p><p><b>Vai 2:</b> Nói điều mình đang lo, lắng nghe đề nghị.</p><p><b>Quan sát:</b> Có lắng nghe, nói rõ ý và tránh công kích không?</p></article>`).join('')}</div>`}
let chatHistory=[],chatDraft='',pending=false;function addBubble(role,text,error=false){const b=document.createElement('div');b.className='bubble '+role+(error?' error':'');const label=document.createElement('span');label.className='role';label.textContent=role==='user'?'BẠN':'NÓI LỜI HAY · AI';b.append(label,document.createTextNode(text));const messages=document.querySelector('#messages');messages.append(b);messages.scrollTop=messages.scrollHeight;return b}function chat(){app.innerHTML=`<section class="chatlayout"><aside class="chataside"><div class="card"><span class="tag">CÙNG BẮT ĐẦU</span><h3>Bạn muốn luyện điều gì?</h3>${groups.map(g=>`<button class="secondary" data-prompt="Mình muốn luyện một tình huống giao tiếp trong bối cảnh ${g.name.toLowerCase()}. Bạn cùng mình đóng vai nhé.">${g.icon} ${g.name}</button>`).join('')}<p style="font-size:14px">Bạn đang trò chuyện với AI. Đừng gửi tên đầy đủ, địa chỉ hay thông tin riêng tư.</p></div></aside><div class="chatpane"><div class="chathead"><strong>Nói lời hay · AI</strong><button class="secondary" id="resetChat">Trò chuyện mới</button></div><div class="messages" id="messages"></div><form class="composer" id="chatForm"><div class="inputrow"><textarea id="chatInput" maxlength="2500" placeholder="Hôm nay bạn muốn kể điều gì?" aria-label="Tin nhắn"></textarea><button id="sendChat">Gửi</button></div><div class="chatnote"><label><input type="checkbox" id="searchWeb"> Tìm kiếm trên web và dẫn nguồn</label><br>Lịch sử chỉ giữ trong phiên này. Khi gặp nguy hiểm, hãy tìm người lớn đáng tin.</div></form></div></section>`;if(chatHistory.length)chatHistory.forEach(m=>addBubble(m.role,m.content));else addBubble('assistant','Chào bạn! Mình có thể cùng bạn luyện cách nói, lắng nghe hoặc nghĩ về một chuyện đang làm bạn băn khoăn. Bạn muốn bắt đầu từ đâu?');const input=document.querySelector('#chatInput');input.value=chatDraft;chatDraft='';document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});document.querySelector('#resetChat').onclick=()=>{if(!pending){chatHistory=[];chat()}};document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();sendChat()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}}}async function sendChat(){const input=document.querySelector('#chatInput');const text=input.value.trim();if(!text||pending)return;pending=true;const send=document.querySelector('#sendChat');send.disabled=true;document.querySelector('#resetChat').disabled=true;input.value='';addBubble('user',text);const wait=addBubble('assistant','Mình đang lắng nghe…');const next=[...chatHistory,{role:'user',content:text}];try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:next,search:document.querySelector('#searchWeb').checked})});const d=await res.json();wait.remove();if(!res.ok){addBubble('assistant',d.error||'Chưa nhận được câu trả lời.',true);input.value=text;return}const b=addBubble('assistant',d.text);chatHistory=[...next,{role:'assistant',content:d.text}].slice(-12);if(d.sources?.length){const sources=document.createElement('div');sources.className='sources';for(const s of d.sources){const a=document.createElement('a');a.href=s.url;a.textContent=s.title;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}b.append(sources)}}catch{wait.remove();if(document.querySelector('#messages'))addBubble('assistant','Chưa kết nối được máy chủ. Bạn thử lại nhé.',true)}finally{pending=false;if(document.querySelector('#sendChat')){document.querySelector('#sendChat').disabled=false;document.querySelector('#resetChat').disabled=false}}}
function route(){if(pending){location.hash='#chat';return}const [name,id]=(location.hash.slice(1)||'home').split('/');document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('current',a.hash==='#'+(name==='scenario'?'practice':name)));if(name==='practice')practice(id);else if(name==='scenario')detail(id);else if(name==='book')book();else if(name==='class')classroom();else if(name==='chat')chat();else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
function cleanSeparators(root=document.body){const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode()){if(!n.parentElement||n.parentElement.closest('script,style,textarea'))continue;n.textContent=n.textContent.replace(/\s+[—–-]\s+/g,' · ').replace(/\s*—\s*/g,' · ');}} document.addEventListener('DOMContentLoaded',()=>{cleanSeparators();new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1)cleanSeparators(n);}).observe(document.body,{childList:true,subtree:true});});
</script></html>
