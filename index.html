<style>:root{--blue:#2944d5;--ink:#18254e;--muted:#657393;--line:#dce2f5}*{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,sans-serif;background:#f5f7ff;color:var(--ink)}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;background:var(--blue);border:0;color:white;border-radius:13px;padding:12px 20px;font-weight:650}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}.secondary{background:#eaf0ff;color:var(--blue)}header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}nav{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;gap:20px}.logo{font-size:25px;font-weight:800;text-decoration:none;color:var(--ink);line-height:1.3}.logo small{display:block;font-size:11px;letter-spacing:1px;color:var(--blue)}.navlinks{display:flex;gap:10px;align-items:center}.navlinks a{color:var(--ink);text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:600;font-size:15px}.navlinks a.current{background:#eaf0ff;color:var(--blue)}main{max-width:1240px;margin:auto;padding:42px 24px 60px;min-height:75vh}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;padding:20px 0 55px}.eyebrow{font-size:13px;color:var(--blue);font-weight:750;letter-spacing:1.6px}h1{font-size:clamp(36px,4.8vw,62px);line-height:1.17;letter-spacing:-1.8px;margin:22px 0}h1 span{color:var(--blue)}h2{font-size:28px;line-height:1.3}h3{line-height:1.4}.muted{color:var(--muted)}.hero p{font-size:19px}.conversation{background:var(--blue);padding:34px;border-radius:34px;color:white;transform:rotate(1deg)}.say{padding:23px;border-radius:22px;background:white;color:var(--ink);margin:18px 0;font-size:19px}.say.reply{background:#d5f5e9;margin-left:30px}.conversation small{display:block;text-align:center}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:white;border:1px solid var(--lin px;margin-top:40px}dialog{border:0;border-radius:20px;padding:0;width:min(96vw,1000px);height:94dvh;max-height:94dvh;background:#e4eafb;color:var(--ink)}dialog::backdrop{background:#16254cbb}.reader{display:flex;flex-direction:column;height:100%}.readerbar{background:white;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;gap:10px}.paperwrap{flex:1;overflow:auto;padding:24px}.paper{background:white;max-width:690px;margin:auto;padding:38px;min-height:850px;border-top:6px solid var(--blue);box-shadow:0 5px 20px #18254e15}.paper h2{font-size:30px;color:var(--blue)}.paper .visual{background:#edf1ff;border-radius:18px;padding:20px;margin:20px 0;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}.visual span{background:white;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-weight:600}.paper blockquote{background:#e4f7ef;padding:20px;border-left:5px solid #30a77a;margin:20px 0}.readerbottom{background:white;padding:12px;display:flex;justify-content:center;gap:14px;align-items:center}.booknumber{font-size:13px;color:var(--muted);margin-top:30px;text-align:right}.chatlayout{display:grid;grid-template-columns:250px 1fr;gap:25px}.chataside .card{padding:20px}.chataside button{display:block;margin:8px 0;width:100%;text-align:left;font-size:14px}.chatpane{background:white;border:1px solid var(--line);border-radius:25px;display:flex;flex-direction:column;height:70dvh;min-height:500px;overflow:hidden}.chathead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chathead strong{font-size:20px}.messages{padding:20px;flex:1;overflow:auto}.bubble{max-width:88%;padding:16px 19px;border-radius:18px;background:#eef2ff;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:var(--blue);color:white;margin-left:auto}.bubble.error{background:#fff0ed;color:#a63c28}.role{display:block;font-size:11px;font-weight:750;margin-bottom:6px}.sources{font-size:13px;margin-top:12px;white-space:normal}.sources a{display:block;color:var(--blue)}.composer{padding:14px 18px;border-top:1px solid var(--line)}.inputrow{display:flex;gap:10px;align-items:flex-end}.composer textarea{width:100%;resize:vertical;min-height:65px;max-height:150px;border:1px solid #c3ceed;border-radius:14px;padding:12px}.chatnote{font-size:12px;color:var(--muted);margin-top:8px}.guide{max-width:800px}.rolecards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.rolecard{background:white;border:1px solid var(--line);padding:25px;border-radius:20px;break-inside:avoid}.footer{padding:25px;border-top:1px solid var(--line);background:white;font-size:14px;color:var(--muted)}.footer>div{max-width:1192px;margin:auto}#printPages{display:none}@media(max-width:900px){.cards,.practicegrid{grid-template-columns:repeat(2,1fr)}nav{align-items:flex-start;flex-direction:column;gap:8px}.navlinks{flex-wrap:wrap;gap:2px}.navlinks a{font-size:13px;padding:8px}.hero{gap:25px}.chatlayout{grid-template-columns:1fr}.chataside{display:none}.chaptergrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:24px 16px}.hero,.bookhome{grid-template-columns:1fr;gap:25px}.hero{padding-bottom:25px}.hero h1{font-size:44px}.conversation{padding:20px}.cards,.practicegrid,.steps,.chaptergrid,.rolecards{grid-template-columns:1fr}.steps{gap:16px}.card{padding:20px}.cover{max-width:330px;width:100%;margin:auto}.detail{padding:20px}.paper{padding:24px;min-height:750px}.paper h2{font-size:25px}.readerbar button,.readerbottom button{font-size:13px;padding:9px 12px}.chatpane{height:72dvh;min-height:450px}.bubble{max-width:95%}.chathead strong{font-size:17px}}@media print{@page{size:A4;margin:12mm}header,.footer,.noprint{display:none!important}body{background:white}body.printbook main,body.printbook dialog{display:none!important}body.printbook #printPages{display:block}.paper{width:100%;min-height:270mm;max-width:none;box-shadow:none;padding:10mm;break-after:page}.paper:last-child{break-after:auto}.rolecards{grid-template-columns:1fr 1fr}.rolecard{border:1px solid #aaa}button{display:none!important}}</style>

<script>
const groups=[{id:'family',name:'Gia đình',icon:'🏡',intro:'Chia sẻ suy nghĩ, lắng nghe và trao đổi với người thân.'},{id:'school',name:'Nhà trường',icon:'🎒',intro:'Tự tin bày tỏ, hợp tác và giải quyết bất đồng.'},{id:'public',name:'Nơi công cộng',icon:'🌿',intro:'Lịch sự và tôn trọng không gian chung.'},{id:'online',name:'Không gian mạng',icon:'💬',intro:'Bình luận có trách nhiệm, bảo vệ sự riêng tư.'}];
const scenarios=[
['family','Xin một khoảng nghỉ','Sau ngày học dài, bạn muốn nghỉ 15 phút. Mẹ muốn bạn học ngay vì lo bạn sẽ quên giờ.',['Cãi lại rồi đóng cửa phòng.','Nói mình đang mệt, đề nghị nghỉ 15 phút và đặt báo giờ.','Không nói gì và tiếp tục dùng điện thoại.'],1,'Nói rõ cảm xúc, đưa thời gian cụ thể và thực hiện lời hứa giúp người thân yên tâm.','Con đang hơi mệt. Con xin nghỉ 15 phút, đặt báo giờ rồi bắt đầu học lúc 7 giờ được không ạ?'],
['family','Khi bị so sánh','Bố nói bạn học chưa tốt bằng một bạn khác. Bạn buồn và muốn được góp ý về tiến bộ của chính mình.',['Chọn lúc bình tĩnh để nói cảm xúc và đề nghị cùng xem phần chưa hiểu.','Nói bố không hiểu gì rồi bỏ đi.','Cố giấu mọi điểm số từ nay.'],0,'Tránh quy kết. Nói vào câu nói cụ thể, cảm xúc và hỗ trợ bạn mong muốn.','Khi nghe bị so sánh, con thấy buồn. Bố giúp con đặt mục tiêu theo tiến bộ của con được không ạ?'],
['family','Thương lượng kế hoạch','Bạn đã hẹn học nhóm chiều thứ Bảy, nhưng gia đình muốn bạn cùng đi thăm người thân.',['Tự ý đi học nhóm.','Hủy hẹn với bạn mà không báo.','Nói về hai kế hoạch, hỏi lý do và cùng tìm thời gian phù hợp.'],2,'Kế hoạch liên quan nhiều người cần được trao đổi; đừng tự thay đổi lịch của người khác.','Con đã hẹn học nhóm. Mình có thể đổi giờ đi thăm, hoặc để con hỏi nhóm đổi giờ được không ạ?'],
['school','Từ chối cho chép bài','Bạn thân xin chép bài và nói sẽ giận nếu bạn không cho.',['Đưa bài vì sợ mất bạn.','Từ chối rõ ràng và đề nghị cùng học phần khó.','Chê bạn lười trước cả lớp.'],1,'Giữ ranh giới và vẫn thể hiện sự quan tâm. Bạn không cần đồng ý với điều sai để giữ tình bạn.','Mình không gửi bài để chép được. Nhưng mình có thể cùng bạn xem phần đang vướng nhé.'],
['school','Bất đồng khi làm nhóm','Hai bạn muốn chọn hai cách trình bày khác nhau. Cả hai bắt đầu nói to.',['Ngắt lời để bảo vệ ý kiến.','Để người nói to nhất quyết định.','Tạm dừng, nghe từng phương án và so sánh theo yêu cầu bài.'],2,'Đưa cuộc trao đổi về mục tiêu chung và tiêu chí cụ thể, tránh hơn thua.','Mình cùng xem mỗi cách đáp ứng yêu cầu nào nhé. Mỗi bạn nói một phút rồi nhóm chọn.'],
['school','Xin lỗi sau lời nói nặng','Bạn bực và nói một câu làm bạn cùng lớp tổn thương.',['Xin lỗi nhưng nói bạn ấy quá nhạy cảm.','Thừa nhận câu nói, xin lỗi và đề nghị cách sửa.','Giả vờ chưa có chuyện gì.'],1,'Lời xin lỗi có trách nhiệm nêu việc mình làm và cách sửa, không đổ lỗi cho người bị tổn thương.','Mình xin lỗi vì câu nói lúc nãy. Nó không công bằng với bạn. Mình sẽ bình tĩnh trước khi nói.'],
['school','Hỏi thầy cô khi chưa hiểu','Bạn chưa hiểu yêu cầu bài tập nhưng ngại hỏi trước lớp.',['Đoán và làm đại.','Nói thầy cô giảng khó hiểu.','Nêu phần đã hiểu và hỏi cụ thể phần còn vướng, hoặc xin hỏi sau tiết học.'],2,'Câu hỏi cụ thể giúp người nghe hỗ trợ đúng chỗ; bạn có thể chọn thời điểm phù hợp.','Em hiểu phần thứ nhất, nhưng chưa rõ cần lấy mấy ví dụ ở phần hai. Cô hướng dẫn lại giúp em được không ạ?'],
['public','Giữ trật tự trên xe','Nhóm bạn nói chuyện rất to trên xe buýt. Bạn thấy người xung quanh khó chịu.',['Nhắc nhẹ để cả nhóm nói nhỏ hơn.','Quát bạn trước mọi người.','Nói to hơn cho vui.'],0,'Nhắc ngắn, lịch sự và nêu ảnh hưởng của hành vi, không làm bạn mất mặt.','Mình nói nhỏ chút nhé, có người đang nghỉ phía sau.'],
['public','Khi bị chen hàng','Một người chen lên trước bạn ở quầy. Bạn khó chịu.',['Đẩy người đó ra.','Nói bình tĩnh rằng mình đang xếp hàng, cần thì nhờ nhân viên.','Chửi người đó.'],1,'Ưu tiên an toàn. Có thể nhắc lịch sự và nhờ người phụ trách thay vì đối đầu.','Mình đang xếp hàng ở đây. Bạn vui lòng đứng phía sau nhé.'],
['public','Làm đổ đồ của người khác','Bạn vô tình va vào và làm đổ đồ uống của người bên cạnh.',['Bỏ đi vì xấu hổ.','Nói không phải lỗi của mình.','Xin lỗi, hỏi người đó có sao không và đề nghị hỗ trợ dọn.'],2,'Nhận trách nhiệm trong khả năng của mình và hỏi trước khi giúp.','Mình xin lỗi vì đã va vào bạn. Bạn có sao không? Mình giúp lau và nhờ nhân viên nhé.'],
['online','Bình luận khó chịu','Một người bình luận chế giễu bài đăng của bạn.',['Đáp lại bằng lời xúc phạm.','Tạm dừng, chọn không phản hồi hoặc nói ranh giới; dùng chặn/báo cáo nếu cần.','Đăng thông tin cá nhân của người đó.'],1,'Bạn không cần trả lời mọi bình luận. Lưu bằng chứng và tìm hỗ trợ nếu hành vi lặp lại hoặc có đe dọa.','Mình không đồng ý với cách nói này. Nếu muốn góp ý, bạn vui lòng trao đổi tôn trọng.'],
['online','Chia sẻ ảnh của bạn','Bạn muốn đăng ảnh nhóm, nhưng một bạn nói không muốn xuất hiện trên mạng.',['Tôn trọng ý kiến, chọn ảnh khác hoặc che phần ảnh của bạn ấy khi được đồng ý.','Đăng vì đó là ảnh của nhóm.','Ép bạn đồng ý.'],0,'Quyền riêng tư cần được tôn trọng; im lặng không đồng nghĩa với đồng ý.','Mình sẽ chọn ảnh khác. Bạn muốn mình bỏ ảnh này hay che phần của bạn?'],
['online','Tin nhắn từ người lạ','Người lạ nhắn xin địa chỉ, ảnh riêng tư và yêu cầu bạn giữ bí mật.',['Gửi để họ tin mình.','Hẹn gặp một mình.','Không gửi thông tin, ngừng liên hệ và báo người lớn đáng tin.'],2,'Yêu cầu giữ bí mật và xin thông tin riêng tư là dấu hiệu cần thận trọng. Ưu tiên an toàn, lưu bằng chứng nếu an toàn.','Mình sẽ không gửi thông tin riêng tư. Mình cần nói với người lớn đáng tin về chuyện này.'],
['online','Hiểu nhầm trong nhóm chat','Câu trả lời ngắn của bạn khiến bạn khác nghĩ bạn đang cáu.',['Mỉa mai vì họ hiểu sai.','Giải thích ý mình, hỏi lại và chuyển sang nói trực tiếp nếu cần.','Kéo cả nhóm vào tranh cãi.'],1,'Tin nhắn thiếu giọng nói và nét mặt nên dễ bị hiểu nhầm. Hỏi lại trước khi quy kết.','Ý mình lúc nãy là mình chưa biết câu trả lời, không phải đang giận. Bạn hiểu thế nào để mình giải thích rõ hơn?']
].map((s,i)=>({id:i,group:s[0],title:s[1],story:s[2],options:s[3],best:s[4],why:s[5],sample:s[6]}));
const app=document.querySelector('#app');let filter='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const group=id=>groups.find(g=>g.id===id);const saved=()=>{try{return JSON.parse(localStorage.getItem('noi-loi-hay-progress')||'[]')}catch{return[]}};function mark(id){try{localStorage.setItem('noi-loi-hay-progress',JSON.stringify([...new Set([...saved(),id])]))}catch{}}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">MỘT CUỘC TRÒ CHUYỆN TỐT BẮT ĐẦU TỪ BẠN</div><h1>Tự tin nói.<br><span>Biết lắng nghe.</span><br>Ứng xử tử tế.</h1><p class="muted">Thử những tình huống quen thuộc, cân nhắc cách phản hồi và luyện bằng lời của chính mình.</p><div class="actions"><button onclick="location.hash='#practice'">Chọn tình huống để luyện</button><button class="secondary" onclick="location.hash='#chat'">Trò chuyện cùng AI</button></div></div><div class="conversation"><div class="eyebrow" style="color:#dbe3ff">MỘT CÁCH NÓI KHÁC</div><div class="say">“Mình không muốn cho bạn chép bài, nhưng sợ bạn giận…”</div><div class="say reply">“Mình không gửi bài để chép được. Nhưng mình có thể cùng bạn xem phần đang vướng nhé.”</div><small>Rõ ràng với lựa chọn của mình. Tôn trọng người đối diện.</small></div></section><div class="cards">${groups.map(g=>`<article class="card"><div class="icon">${g.icon}</div><h3>${g.name}</h3><p>${g.intro}</p><a href="#practice/${g.id}">${scenarios.filter(s=>s.group===g.id).length} tình huống · Khám phá</a></article>`).join('')}</div><section class="steps"><div><b>01 · Thử một lựa chọn</b><p>Nhận diện tình huống và cân nhắc ảnh hưởng.</p></div><div><b>02 · Luyện lời của bạn</b><p>Viết câu phản hồi, đọc gợi ý và thử diễn đạt lại.</p></div><div><b>03 · Mang vào cuộc sống</b><p>Đóng vai cùng bạn và vận dụng khi phù hợp.</p></div></section>`}
function practice(id){filter=groups.some(g=>g.id===id)?id:'all';const done=saved();app.innerHTML=`<div class="eyebrow">LUYỆN TÌNH HUỐNG</div><h1 style="font-size:42px">Chọn một chuyện gần với bạn.</h1><p class="muted">Đã thực hành ${done.length}/${scenarios.length} tình huống trên máy này. Đây là tiến độ luyện tập, không phải điểm đánh giá bạn.</p><div class="filter"><button class="${filter==='all'?'active':''}" onclick="location.hash='#practice'">Tất cả</button>${groups.map(g=>`<button class="${filter===g.id?'active':''}" onclick="location.hash='#practice/${g.id}'">${g.icon} ${g.name}</button>`).join('')}</div><div class="practicegrid">${scenarios.filter(s=>filter==='all'||s.group===filter).map(s=>`<article class="card"><span class="tag">${group(s.group).name.toUpperCase()} ${done.includes(s.id)?'· ĐÃ LUYỆN':''}</span><h3>${s.title}</h3><p>${s.story}</p><button onclick="location.hash='#scenario/${s.id}'">Thử tình huống</button></article>`).join('')}</div>`}
function detail(id){const s=scenarios.find(s=>s.id===Number(id));if(!s)return practice();app.innerHTML=`<section class="detail"><button class="secondary" onclick="location.hash='#practice/${s.group}'">Về danh sách</button><p class="tag">${group(s.group).name.toUpperCase()}</p><h1>${s.title}</h1><div class="situation">${s.story}</div><h3>Bạn sẽ chọn cách nào?</h3>${s.options.map((o,i)=>`<button class="option" data-choice="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="feedback"></div><h3>Thử viết bằng lời của bạn</h3><textarea id="own" maxlength="1500" placeholder="Bạn sẽ nói hoặc làm gì?"></textarea><div class="actions"><button id="hint">Xem câu nói tham khảo</button><button class="secondary" id="aiPractice">Cùng AI luyện thêm</button><button class="secondary" onclick="detail(${s.id})">Luyện lại</button></div><div id="sample"></div></section>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const good=Number(b.dataset.choice)===s.best;document.querySelector('#feedback').innerHTML=`<div class="feedback"><b>${good?'Đây là một cách phù hợp.':'Cùng cân nhắc một cách khác.'}</b><p>${good?s.why:'Lựa chọn này có thể làm tình huống căng thẳng hoặc khó giải quyết hơn. '+s.why}</p><b>Hướng thử:</b> ${s.options[s.best]}</div>`;mark(s.id)});document.querySelector('#hint').onclick=()=>{document.querySelector('#sample').innerHTML=`<div class="feedback"><b>Một câu có thể thử</b><p>“${s.sample}”</p><small>Bạn có thể đổi cách xưng hô và từ ngữ cho phù hợp.</small></div>`;mark(s.id)};document.querySelector('#aiPractice').onclick=()=>{chatDraft=`Mình đang luyện tình huống: ${s.story}\nCâu trả lời mình thử viết: ${document.querySelector('#own').value||'(mình chưa biết nói thế nào)'}\nBạn giúp mình nhận xét và cùng mình đóng vai nhé.`;location.hash='#chat'}}
const foundations=[['Bạn không cần nói hoàn hảo','Giao tiếp tốt là nói rõ điều mình cần, lắng nghe người khác và chọn cách ứng xử phù hợp. Bạn có thể luyện từng bước.',['Chọn một tình huống gần với bạn.','Đọc cách xử lý và thử nói thành tiếng.','Nhìn lại điều đã giúp cuộc trao đổi tốt hơn.'],'Hôm nay mình muốn luyện một cuộc trò chuyện nào?'],['Ba mức luyện tập','Bạn có thể cần gợi ý trong tình huống này và tự tin trong tình huống khác. Các mức không phải nhãn đánh giá bạn.',['Nhận biết: gọi tên cảm xúc và mục đích.','Có gợi ý: hoàn thành câu mẫu hoặc đóng vai.','Vận dụng: tự chọn cách nói và điều chỉnh sau khi nghe.'],'Mình chọn mức nào để có thể luyện được hôm nay?'],['Dừng lại trước khi phản ứng','Khi tức giận, bạn có thể cần một khoảng dừng trước khi lựa chọn lời nói.',['Nhận ra tín hiệu: tim nhanh, giọng lớn, muốn ngắt lời.','Thở chậm và tạm dừng khi an toàn.','Hẹn thời điểm quay lại, rồi nói về sự việc cụ thể.'],'Mình đang bực. Mình xin bình tĩnh vài phút rồi nói tiếp nhé.'],['Lắng nghe để hiểu','Lắng nghe không có nghĩa là đồng ý với mọi điều. Bạn có thể hiểu điều người khác cần rồi bày tỏ ý kiến.',['Để người kia nói hết khi có thể.','Nhắc lại ý chính bằng lời của mình.','Hỏi điều chưa rõ trước khi kết luận.'],'Ý bạn là bạn lo nhóm không kịp làm xong, đúng không?'],['Nói rõ cảm xúc và đề nghị','Câu nói về cảm xúc có ích khi gắn với sự việc cụ thể và một bước tiếp theo.',['Nêu sự việc, tránh “lúc nào cũng” hoặc “chẳng bao giờ”.','Nói cảm xúc và điều bạn cần.','Đề nghị một việc cụ thể, vừa sức.'],'Khi bị ngắt lời, mình khó nói hết ý. Bạn cho mình nói xong rồi góp ý nhé.'],['Từ chối mà vẫn tôn trọng','Bạn có quyền từ chối yêu cầu không phù hợp và giữ ranh giới của mình.',['Nói không rõ ràng, không cần giải thích quá nhiều.','Giữ giọng bình tĩnh và lặp lại khi bị ép.','Đề nghị phương án phù hợp nếu bạn muốn và thấy an toàn.'],'Mình không đồng ý việc đó. Mình có thể giúp bạn bằng cách khác.'],['Xin lỗi có trách nhiệm','Lời xin lỗi không xóa ngay tổn thương. Hành động sau lời xin lỗi cũng quan trọng.',['Nêu việc mình đã làm.','Xin lỗi, không đổ lỗi ngược lại.','Hỏi cách sửa trong khả năng và thay đổi hành vi.'],'Mình xin lỗi vì đã nói nặng lời. Mình sẽ để bạn nói hết trước khi phản hồi.'],['Nhìn từ hai phía','Bất đồng có thể xuất phát từ hai nhu cầu khác nhau, không nhất thiết vì ai đó muốn gây khó dễ.',['Nói điều bạn lo hoặc cần.','Hỏi người kia đang cần điều gì.','Tìm mục tiêu chung và một cách thử cụ thể.'],'Mình muốn làm nhanh, còn bạn muốn đọc kỹ đề. Mình cùng đọc 5 phút rồi chia việc nhé.']];
const bookPages=[{title:'Nói lời hay',chapter:'CẨM NANG GIAO TIẾP & ỨNG XỬ',intro:'Dành cho học sinh lớp 6–9. Tự tin bày tỏ. Biết lắng nghe. Cùng tìm cách giải quyết.',steps:['Trong gia đình','Ở nhà trường','Nơi công cộng','Trên không gian mạng'],sample:'Luyện từng chút. Mang một điều nhỏ vào cuộc sống.',visual:['Lắng nghe','Bày tỏ','Cùng giải quyết']},...foundations.map(x=>({title:x[0],chapter:'NỀN TẢNG GIAO TIẾP',intro:x[1],steps:x[2],sample:x[3],visual:['Nhận diện','Cân nhắc','Thực hành']})),...scenarios.flatMap(s=>[{title:s.title,chapter:group(s.group).name.toUpperCase(),intro:s.story,steps:['Tạm dừng để nhận ra cảm xúc và ưu tiên an toàn.',s.options[s.best],s.why,'Sau cuộc trao đổi, nhìn lại điều phù hợp và điều cần thay đổi.'],sample:s.sample,visual:['Tình huống','Cách xử lý','Câu nói mẫu']},{title:'Bài luyện · '+s.title,chapter:group(s.group).name.toUpperCase(),intro:'Quay lại tình huống: '+s.story,steps:['Nhận biết: bạn và người kia có thể đang cảm thấy gì?','Có gợi ý: viết một câu phản hồi tôn trọng, rõ ý.','Vận dụng: đóng vai hai lượt. Nếu người kia chưa đồng ý, bạn sẽ nói gì?','Tự đối chiếu: câu của bạn có tránh công kích, nêu ý rõ và đề nghị bước tiếp theo không?'],sample:s.sample,visual:['Viết thử','Đóng vai','Nhìn lại']}]),{title:'Khi cần tìm hỗ trợ',chapter:'VẬN DỤNG & TÌM HỖ TRỢ',intro:'Bạn không phải tự giải quyết mọi chuyện. Khi có đe dọa, bắt nạt lặp lại, xâm hại hoặc nguy hiểm, tìm người lớn đáng tin là một bước quan trọng.',steps:['Đến nơi an toàn nếu có thể.','Nói với người thân, giáo viên hoặc người phụ trách mà bạn tin.','Lưu bằng chứng khi an toàn; không tự đối đầu.','Nếu người đầu tiên chưa hỗ trợ, tiếp tục tìm một người lớn khác.'],sample:'Mình đang gặp chuyện làm mình lo. Mình cần người lớn giúp để được an toàn.',visual:['An toàn','Tìm người hỗ trợ','Cùng xử lý']}];let page=0;function paper(p,i){return `<article class="paper"><span class="tag">${p.chapter}</span><h2>${p.title}</h2><div class="visual" aria-label="Các bước thực hành">${p.visual.map(v=>`<span>${v}</span>`).join('')}</div><p>${p.intro}</p><h3>Thử từng bước</h3><ol>${p.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h3>Câu tham khảo</h3><blockquote>“${p.sample}”</blockquote><p><b>Nhìn lại:</b> Bạn muốn thay đổi từ nào để câu nói phù hợp với mình? Chọn một điều để thử trong cuộc sống.</p><div class="booknumber">${i+1} / ${bookPages.length} · NÓI LỜI HAY</div></article>`}function showPage(){document.querySelector('#paperwrap').innerHTML=paper(bookPages[page],page);document.querySelector('#counter').textContent=`${page+1} / ${bookPages.length}`;document.querySelector('#prevPage').disabled=page===0;document.querySelector('#nextPage').disabled=page===bookPages.length-1;document.querySelector('#paperwrap').scrollTop=0}function openBook(i=0){page=i;showPage();document.querySelector('#bookDialog').showModal()}function book(){app.innerHTML=`<section class="bookhome"><div><div class="eyebrow">CẨM NANG ĐIỆN TỬ · KHỔ A4</div><h1>Mở sách.<br><span>Luyện từng cuộc<br>trò chuyện.</span></h1><p class="muted">${bookPages.length} trang hướng dẫn và bài luyện. Đọc từng trang, chọn chương và in hoặc lưu PDF A4.</p><div class="actions"><button onclick="openBook()">Mở cẩm nang</button><button class="secondary" onclick="printBook()">In / Lưu PDF A4</button></div></div><button class="cover" onclick="openBook()"><small>CẨM NANG GIAO TIẾP & ỨNG XỬ</small><h2>Nói lời hay</h2><div class="quote">Tự tin bày tỏ.<br>Biết lắng nghe.</div><small>DÀNH CHO HỌC SINH LỚP 6–9 · BẤM ĐỂ MỞ</small></button></section><div class="chaptergrid"><article class="card"><h3>Nền tảng</h3><p>Cảm xúc, lắng nghe, bày tỏ và giữ ranh giới.</p><button class="secondary" onclick="openBook(1)">Đọc chương</button></article>${groups.map(g=>`<article class="card"><h3>${g.icon} ${g.name}</h3><p>${g.intro}</p><button class="secondary" onclick="openBook(${9+scenarios.findIndex(s=>s.group===g.id)*2})">Đọc chương</button></article>`).join('')}</div>`}function printBook(){document.querySelector('#printPages').innerHTML=bookPages.map(paper).join('');document.body.classList.add('printbook');window.print()}window.addEventListener('afterprint',()=>document.body.classList.remove('printbook'));document.querySelector('#printBook').onclick=printBook;document.querySelector('#closeBook').onclick=()=>document.querySelector('#bookDialog').close();document.querySelector('#prevPage').onclick=()=>{if(page>0){page--;showPage()}};document.querySelector('#nextPage').onclick=()=>{if(page<bookPages.length-1){page++;showPage()}};window.addEventListener('keydown',e=>{if(!document.querySelector('#bookDialog').open)return;if(e.key==='ArrowRight'&&page<bookPages.length-1){page++;showPage()}if(e.key==='ArrowLeft'&&page>0){page--;showPage()}});
function classroom(){app.innerHTML=`<div class="guide"><div class="eyebrow">TRONG TIẾT HỌC</div><h1 style="font-size:42px">Thử một cuộc trò chuyện.</h1><p>Chia nhóm 3 người: một người đóng vai học sinh, một người đóng vai người đối diện, một người quan sát. Mỗi lượt 3–5 phút, sau đó đổi vai.</p><ol><li>Đọc tình huống và xác định nhu cầu của mỗi phía.</li><li>Đóng vai hai lượt nói; thử một cách phản hồi tôn trọng.</li><li>Người quan sát nêu một điều hiệu quả và một gợi ý cụ thể.</li><li>Luyện lại, rồi ghi câu nói bạn muốn mang vào cuộc sống.</li></ol><p class="muted">Dùng tình huống giả định. Không yêu cầu học sinh kể trải nghiệm riêng tư trước lớp.</p></div><button class="noprint" onclick="window.print()">In thẻ đóng vai</button><div class="rolecards" style="margin-top:25px">${scenarios.map(s=>`<article class="rolecard"><span class="tag">${group(s.group).name.toUpperCase()}</span><h3>${s.title}</h3><p>${s.story}</p><p><b>Vai 1:</b> Bày tỏ cảm xúc, nhu cầu và một đề nghị.</p><p><b>Vai 2:</b> Nói điều mình đang lo, lắng nghe đề nghị.</p><p><b>Quan sát:</b> Có lắng nghe, nói rõ ý và tránh công kích không?</p></article>`).join('')}</div>`}
let chatHistory=[],chatDraft='',pending=false;function addBubble(role,text,error=false){const b=document.createElement('div');b.className='bubble '+role+(error?' error':'');const label=document.createElement('span');label.className='role';label.textContent=role==='user'?'BẠN':'NÓI LỜI HAY · AI';b.append(label,document.createTextNode(text));const messages=document.querySelector('#messages');messages.append(b);messages.scrollTop=messages.scrollHeight;return b}function chat(){app.innerHTML=`<section class="chatlayout"><aside class="chataside"><div class="card"><span class="tag">CÙNG BẮT ĐẦU</span><h3>Bạn muốn luyện điều gì?</h3>${groups.map(g=>`<button class="secondary" data-prompt="Mình muốn luyện một tình huống giao tiếp trong bối cảnh ${g.name.toLowerCase()}. Bạn cùng mình đóng vai nhé.">${g.icon} ${g.name}</button>`).join('')}<p style="font-size:14px">Bạn đang trò chuyện với AI. Đừng gửi tên đầy đủ, địa chỉ hay thông tin riêng tư.</p></div></aside><div class="chatpane"><div class="chathead"><strong>Nói lời hay · AI</strong><button class="secondary" id="resetChat">Trò chuyện mới</button></div><div class="messages" id="messages"></div><form class="composer" id="chatForm"><div class="inputrow"><textarea id="chatInput" maxlength="2500" placeholder="Hôm nay bạn muốn kể điều gì?" aria-label="Tin nhắn"></textarea><button id="sendChat">Gửi</button></div><div class="chatnote"><label><input type="checkbox" id="searchWeb"> Tìm kiếm trên web và dẫn nguồn</label><br>Lịch sử chỉ giữ trong phiên này. Khi gặp nguy hiểm, hãy tìm người lớn đáng tin.</div></form></div></section>`;if(chatHistory.length)chatHistory.forEach(m=>addBubble(m.role,m.content));else addBubble('assistant','Chào bạn! Mình có thể cùng bạn luyện cách nói, lắng nghe hoặc nghĩ về một chuyện đang làm bạn băn khoăn. Bạn muốn bắt đầu từ đâu?');const input=document.querySelector('#chatInput');input.value=chatDraft;chatDraft='';document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});document.querySelector('#resetChat').onclick=()=>{if(!pending){chatHistory=[];chat()}};document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();sendChat()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}}}async function sendChat(){const input=document.querySelector('#chatInput');const text=input.value.trim();if(!text||pending)return;pending=true;const send=document.querySelector('#sendChat');send.disabled=true;document.querySelector('#resetChat').disabled=true;input.value='';addBubble('user',text);const wait=addBubble('assistant','Mình đang lắng nghe…');const next=[...chatHistory,{role:'user',content:text}];try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:next,search:document.querySelector('#searchWeb').checked})});const d=await res.json();wait.remove();if(!res.ok){addBubble('assistant',d.error||'Chưa nhận được câu trả lời.',true);input.value=text;return}const b=addBubble('assistant',d.text);chatHistory=[...next,{role:'assistant',content:d.text}].slice(-12);if(d.sources?.length){const sources=document.createElement('div');sources.className='sources';for(const s of d.sources){const a=document.createElement('a');a.href=s.url;a.textContent=s.title;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}b.append(sources)}}catch{wait.remove();if(document.querySelector('#messages'))addBubble('assistant','Chưa kết nối được máy chủ. Bạn thử lại nhé.',true)}finally{pending=false;if(document.querySelector('#sendChat')){document.querySelector('#sendChat').disabled=false;document.querySelector('#resetChat').disabled=false}}}
function route(){if(pending){location.hash='#chat';return}const [name,id]=(location.hash.slice(1)||'home').split('/');document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('current',a.hash==='#'+(name==='scenario'?'practice':name)));if(name==='practice')practice(id);else if(name==='scenario')detail(id);else if(name==='book')book();else if(name==='class')classroom();else if(name==='chat')chat();else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></html>
